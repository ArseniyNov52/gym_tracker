                      {template.exercises.map(e => e.exerciseName).join(', ')}
                    </p>
                    <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
                      <button onClick={() => openViewModal(template)} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                        <span>👁️</span> Посмотреть
                      </button>
                      <button onClick={() => openEditModal(template)} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                        <span>✏️</span> Изменить
                      </button>
                      <button onClick={() => onStartFromTemplate(template.id)} className="btn btn-success" style={{fontSize: '0.875rem', marginLeft: 'auto'}}>
                        <span>▶️</span> Начать
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {showModal && (
            <Modal onClose={() => setShowModal(false)} title={editingTemplate ? 'Редактировать шаблон' : 'Создать шаблон тренировки'}>
              <div style={{display: 'flex', flexDirection: 'column', gap: '1.5rem'}}>
                <div className="form-group">
                  <label className="label">Название тренировки</label>
                  <input type="text" value={templateName} onChange={e => setTemplateName(e.target.value)} placeholder="Например: Грудь и трицепс" className="input" />
                </div>

                <div className="form-group">
                  <label className="label">Поиск упражнений</label>
                  <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Введите название упражнения..." className="input" />
                </div>

                <div className="form-group">
                  <label className="label">Выберите упражнения</label>
                  <div style={{maxHeight: '40vh', overflowY: 'auto', border: '1px solid #e2e8f0', borderRadius: '8px', padding: '0.75rem'}}>
                    {Object.entries(groupedExercises).map(([group, exList]) => (
                      <div key={group} style={{marginBottom: '1rem'}}>
                        <h4 style={{fontWeight: 600, color: '#475569', fontSize: '0.875rem', textTransform: 'uppercase', marginBottom: '0.5rem'}}>{group}</h4>
                        {exList.map(ex => (
                          <div key={ex.id} style={{display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.5rem'}}>
                            <input
                              type="checkbox"
                              checked={selectedExercises.has(ex.id)}
                              onChange={() => {
                                const updated = new Set(selectedExercises);
                                if (updated.has(ex.id)) {
                                  updated.delete(ex.id);
                                  const newRestTimes = {...exerciseRestTimes};
                                  delete newRestTimes[ex.id];
                                  setExerciseRestTimes(newRestTimes);
                                } else {
                                  updated.add(ex.id);
                                }
                                setSelectedExercises(updated);
                              }}
                              style={{width: '18px', height: '18px', cursor: 'pointer'}}
                            />
                            <label style={{flex: 1, cursor: 'pointer', fontSize: '0.875rem', color: '#0f172a'}}>
                              {ex.name}
                            </label>
                            {selectedExercises.has(ex.id) && (
                              <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                                {exerciseRestTimes[ex.id] && (
                                  <span style={{fontSize: '0.75rem', color: '#64748b'}}>
                                    ⏱️ {Math.floor(exerciseRestTimes[ex.id] / 60)}:{(exerciseRestTimes[ex.id] % 60).toString().padStart(2, '0')}
                                  </span>
                                )}
                                <button
                                  onClick={() => setRestTimeForExercise(ex.id)}
                                  style={{background: 'none', border: 'none', cursor: 'pointer', fontSize: '1rem'}}
                                  title="Установить таймер отдыха"
                                >
                                  ⏱️
                                </button>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>

                <button onClick={saveTemplate} className="btn btn-primary">
                  {editingTemplate ? 'Сохранить изменения' : 'Создать шаблон'}
                </button>
              </div>
            </Modal>
          )}

          {showViewModal && viewingTemplate && (
            <Modal onClose={() => setShowViewModal(false)} title={viewingTemplate.name}>
              <div style={{display: 'flex', flexDirection: 'column', gap: '0.75rem'}}>
                {viewingTemplate.exercises.map((ex, idx) => (
                  <div key={idx} style={{padding: '0.75rem', background: '#f8fafc', borderRadius: '8px'}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                      <span style={{fontWeight: 500, color: '#0f172a'}}>{idx + 1}. {ex.exerciseName}</span>
                      {ex.restTime && (
                        <span style={{fontSize: '0.875rem', color: '#64748b'}}>
                          ⏱️ {Math.floor(ex.restTime / 60)}:{(ex.restTime % 60).toString().padStart(2, '0')}
                        </span>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </Modal>
          )}
        </div>
      );
    }

    const MUSCLE_GROUP_COLORS = {
      'Спина': '#3b82f6',
      'Грудь': '#ef4444',
      'Ноги': '#10b981',
      'Плечи': '#f59e0b',
      'Бицепс': '#8b5cf6',
      'Трицепс': '#ec4899',
      'Пресс': '#06b6d4',
      'Прочие': '#64748b'
    };

    const CORE_MUSCLE_GROUPS = ['Ноги', 'Спина', 'Грудь', 'Плечи', 'Пресс', 'Бицепс', 'Трицепс'];

    function MuscleBalanceCard({ workouts, exercises }) {
      const now = Date.now();
      const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
      const weekWorkouts = (workouts || []).filter(w => {
        const t = new Date(w.endDate || w.startDate).getTime();
        return !isNaN(t) && (now - t) <= sevenDaysMs;
      });

      const groupSets = {};
      let totalWeekSets = 0;

      weekWorkouts.forEach(w => {
        (w.exercises || []).forEach(ex => {
          const exDef = exercises.find(e => e.id === ex.exerciseId) || exercises.find(e => e.name === ex.exerciseName);
          const grp = (exDef && exDef.group) || ex.group || 'Прочие';
          const count = (ex.sets || []).length;
          if (count > 0) {
            groupSets[grp] = (groupSets[grp] || 0) + count;
            totalWeekSets += count;
          }
        });
      });

      const activeGroups = Object.entries(groupSets)
        .map(([group, count]) => {
          const percentage = totalWeekSets > 0 ? Math.round((count / totalWeekSets) * 100) : 0;
          return {
            group,
            count,
            percentage,
            color: MUSCLE_GROUP_COLORS[group] || '#6366f1'
          };
        })
        .sort((a, b) => b.count - a.count);

      const radius = 38;
      const circumference = 2 * Math.PI * radius;
      let currentOffset = 0;
      const donutSegments = activeGroups.map(item => {
        const ratio = totalWeekSets > 0 ? item.count / totalWeekSets : 0;
        const len = ratio * circumference;
        const seg = {
          ...item,
          length: len,
          offset: currentOffset
        };
        currentOffset += len;
        return seg;
      });

      const missingCore = CORE_MUSCLE_GROUPS.filter(g => !groupSets[g] || groupSets[g] === 0);

      const formatSets = (n) => {
        const m10 = n % 10;
        const m100 = n % 100;
        if (m100 >= 11 && m100 <= 19) return 'подходов';
        if (m10 === 1) return 'подход';
        if (m10 >= 2 && m10 <= 4) return 'подхода';
        return 'подходов';
      };

      return (
        <div className="card" style={{ padding: '1.25rem', marginBottom: '0.25rem' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0.5rem', marginBottom: '1rem', paddingBottom: '0.75rem', borderBottom: '1px solid #f1f5f9' }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: '1.05rem', fontWeight: 700, color: '#0f172a', display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                <span>⚖️</span> Баланс мышечных групп
              </div>
              <div style={{ fontSize: '0.75rem', color: '#64748b', marginTop: '2px' }}>
                Распределение за последние 7 дней
              </div>
            </div>
            <span style={{ fontSize: '0.75rem', fontWeight: 600, color: '#2563eb', background: '#eff6ff', padding: '4px 10px', borderRadius: '999px', border: '1px solid #dbeafe', whiteSpace: 'nowrap' }}>
              {totalWeekSets} {formatSets(totalWeekSets)}
            </span>
          </div>

          {totalWeekSets === 0 ? (
            <div style={{ textAlign: 'center', padding: '1.5rem 1rem', background: '#f8fafc', borderRadius: '12px', border: '1px dashed #cbd5e1' }}>
              <div style={{ fontSize: '2rem', marginBottom: '0.4rem' }}>📊</div>
              <div style={{ fontWeight: 600, color: '#334155', fontSize: '0.95rem' }}>Нет данных за последние 7 дней</div>
              <div style={{ fontSize: '0.8rem', color: '#64748b', marginTop: '4px' }}>
                Завершите тренировку, чтобы увидеть баланс нагрузки на мышцы
              </div>
            </div>
          ) : (
            <div>
              <div style={{ height: '10px', width: '100%', borderRadius: '5px', overflow: 'hidden', display: 'flex', marginBottom: '1.25rem', background: '#f1f5f9', boxShadow: 'inset 0 1px 2px rgba(0,0,0,0.06)' }}>
                {activeGroups.map((item, idx) => (
                  <div
                    key={item.group}
                    style={{
                      height: '100%',
                      width: `${(item.count / totalWeekSets) * 100}%`,
                      background: item.color,
                      borderRight: idx < activeGroups.length - 1 ? '1.5px solid white' : 'none',
                      transition: 'width 0.4s ease'
                    }}
                    title={`${item.group}: ${item.count} подх. (${item.percentage}%)`}
                  />
                ))}
              </div>

              <div style={{ display: 'flex', flexDirection: 'row', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'center', gap: '1.25rem' }}>
                <div style={{ position: 'relative', width: '130px', height: '130px', flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <svg width="130" height="130" viewBox="0 0 100 100" style={{ transform: 'rotate(-90deg)' }}>
                    <circle cx="50" cy="50" r={radius} fill="transparent" stroke="#f1f5f9" strokeWidth="12" />
                    {donutSegments.map(seg => (
                      <circle
                        key={seg.group}
                        cx="50"
                        cy="50"
                        r={radius}
                        fill="transparent"
                        stroke={seg.color}
                        strokeWidth="12"
                        strokeDasharray={`${seg.length} ${circumference}`}
                        strokeDashoffset={-seg.offset}
                        strokeLinecap="butt"
                      />
                    ))}
                  </svg>
                  <div style={{ position: 'absolute', textAlign: 'center', pointerEvents: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                    <span style={{ fontSize: '1.35rem', fontWeight: 800, color: '#0f172a', lineHeight: 1 }}>
                      {totalWeekSets}
                    </span>
                    <span style={{ fontSize: '0.65rem', fontWeight: 600, color: '#64748b', textTransform: 'uppercase', letterSpacing: '0.5px', marginTop: '3px' }}>
                      подходов
                    </span>
                  </div>
                </div>

                <div style={{ flex: '1 1 200px', minWidth: '175px', display: 'flex', flexDirection: 'column', gap: '0.65rem' }}>
                  {activeGroups.map(item => (
                    <div key={item.group} style={{ display: 'flex', flexDirection: 'column', gap: '3px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.8rem' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', minWidth: 0 }}>
                          <span style={{ width: '8px', height: '8px', borderRadius: '50%', background: item.color, flexShrink: 0 }}></span>
                          <span style={{ fontWeight: 600, color: '#1e293b', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                            {item.group}
                          </span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flexShrink: 0, marginLeft: '0.5rem' }}>
                          <span style={{ color: '#64748b', fontSize: '0.75rem' }}>{item.count} подх.</span>
                          <span style={{ fontWeight: 700, color: '#0f172a', minWidth: '32px', textAlign: 'right' }}>{item.percentage}%</span>
                        </div>
                      </div>
                      <div style={{ height: '6px', background: '#f1f5f9', borderRadius: '3px', overflow: 'hidden' }}>
                        <div style={{ height: '100%', width: `${item.percentage}%`, background: item.color, borderRadius: '3px', transition: 'width 0.4s ease' }} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {missingCore.includes('Ноги') ? (
                <div style={{ marginTop: '1rem', padding: '0.65rem 0.85rem', background: '#fef2f2', border: '1px solid #fee2e2', borderRadius: '10px', display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.8rem', color: '#991b1b' }}>
                  <span style={{ fontSize: '1.1rem', flexShrink: 0 }}>⚠️</span>
                  <div>
                    <strong>Пропущен день ног:</strong> за последние 7 дней не зафиксировано ни одного подхода на ноги.
                  </div>
                </div>
              ) : missingCore.length > 0 && missingCore.length <= 4 ? (
                <div style={{ marginTop: '1rem', padding: '0.65rem 0.85rem', background: '#fffbeb', border: '1px solid #fef3c7', borderRadius: '10px', display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.8rem', color: '#92400e' }}>
                  <span style={{ fontSize: '1.1rem', flexShrink: 0 }}>💡</span>
                  <div>
                    <strong>Отстающие зоны (0 подходов):</strong> {missingCore.join(', ')}.
                  </div>
                </div>
              ) : missingCore.length === 0 ? (
                <div style={{ marginTop: '1rem', padding: '0.65rem 0.85rem', background: '#f0fdf4', border: '1px solid #dcfce7', borderRadius: '10px', display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.8rem', color: '#166534' }}>
                  <span style={{ fontSize: '1.1rem', flexShrink: 0 }}>✅</span>
                  <div>
                    <strong>Отличный баланс!</strong> Все ключевые группы мышц получили нагрузку за последние 7 дней.
                  </div>
                </div>
              ) : null}
            </div>
          )}
        </div>
      );
    }

    function HistoryTab({ workouts, exercises }) {
      const [expandedId, setExpandedId] = useState(null);
      const [showShareModal, setShowShareModal] = useState(false);
      const [sharingWorkout, setSharingWorkout] = useState(null);

      /* Изменена функция getMoodEmoji для 3 смайликов */
      const getMoodEmoji = (m) => m === 1 ? '😫' : m === 3 ? '😄' : '😐';
      /* </CHANGE> */

      const generateWorkoutShareText = (workout) => {
        const start = new Date(workout.startDate);
        const end = workout.endDate ? new Date(workout.endDate) : null;
        const duration = end ? Math.round((end.getTime() - start.getTime()) / 60000) : 0;
        const totalVolume = workout.exercises.reduce(
          (sum, ex) => sum + ex.sets.reduce((s, set) => s + (set.weight || 0) * set.reps, 0),
          0
        );
        
        let text = `💪 GymFlow - Моя тренировка\n\n`;
        text += `📅 ${start.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}\n`;
        text += `🏋️ ${workout.templateName}\n`;
        text += `⏱️ ${duration} мин\n`;
        text += `⚖️ ${(totalVolume / 1000).toFixed(1)} тонн\n`;
        if (workout.overallMood) {
          text += `${getMoodEmoji(workout.overallMood)} Самочувствие: ${workout.overallMood}/3\n`;
        }
        text += `\n📋 Упражнения:\n`;
        workout.exercises.forEach((ex, idx) => {
          const exDef = exercises.find(e => e.id === ex.exerciseId);
          const hasWeight = exDef ? checkExerciseHasWeight(exDef) : checkExerciseHasWeight(ex);
          text += `\n${idx + 1}. ${ex.exerciseName}\n`;
          ex.sets.forEach((set, setIdx) => {
            const setStr = hasWeight && set.weight > 0 ? `${set.weight} кг × ${set.reps} повт.` : `${set.reps} повт.`;
            text += `   ${setIdx + 1}. ${setStr}\n`;
          });
        });
        
        if (workout.notes) {
          text += `\n📝 Заметки: ${workout.notes}\n`;
        }
        
        return text;
      };

      const shareWorkout = (workout) => {
        setSharingWorkout(workout);
        setShowShareModal(true);
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text).then(() => {
          alert('📋 Скопировано в буфер обмена!');
        }).catch(() => {
          alert('Не удалось скопировать. Попробуйте снова.');
        });
      };

      if (workouts.length === 0) {
        return (
          <div className="card empty-state">
            <div className="empty-icon">📈</div>
            <h3 className="empty-title">История пуста</h3>
            <p>Завершите первую тренировку</p>
          </div>
        );
      }

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
          <MuscleBalanceCard workouts={workouts} exercises={exercises} />

          {[...workouts].reverse().map(workout => {
            const start = new Date(workout.startDate);
            const end = workout.endDate ? new Date(workout.endDate) : null;
            const duration = end ? Math.round((end.getTime() - start.getTime()) / 60000) : 0;
            const totalSets = workout.exercises.reduce((sum, ex) => sum + ex.sets.length, 0);
            const totalVolume = workout.exercises.reduce(
              (sum, ex) => sum + ex.sets.reduce((s, set) => s + (set.weight || 0) * set.reps, 0),
              0
            );

            return (
              <div key={workout.id} className="card" style={{padding: 0, overflow: 'hidden'}}>
                <button
                  onClick={() => setExpandedId(expandedId === workout.id ? null : workout.id)}
                  style={{width: '100%', padding: '1.5rem', textAlign: 'left', background: 'none', border: 'none', cursor: 'pointer'}}
                >
                  <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.75rem'}}>
                    <div style={{display: 'flex', alignItems: 'center', gap: '0.75rem'}}>
                      <span style={{fontWeight: 600, color: '#0f172a'}}>
                        {start.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })}
                      </span>
                      {workout.overallMood && (
                        <span style={{fontSize: '1.25rem'}}>{getMoodEmoji(workout.overallMood)}</span>
                      )}
                    </div>
                    <span style={{fontSize: '1.25rem', color: '#94a3b8', transition: 'transform 0.2s', transform: expandedId === workout.id ? 'rotate(180deg)' : 'rotate(0deg)'}}>
                      🔽
                    </span>
                  </div>
                  <p style={{fontSize: '0.875rem', color: '#64748b', fontWeight: 500, marginBottom: '0.5rem'}}>{workout.templateName}</p>
                  <div style={{display: 'flex', flexWrap: 'wrap', gap: '0.75rem', fontSize: '0.875rem', color: '#64748b'}}>
                    <span>{start.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span>
                    {end && <><span>•</span><span>{end.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span></>}
                    <span>•</span>
                    <span>{workout.exercises.length} упражнений</span>
                    <span>•</span>
                    <span>{totalSets} подходов</span>
                    <span>•</span>
                    <span>{(totalVolume / 1000).toFixed(1)} тонн</span>
                    {duration > 0 && <><span>•</span><span>{duration} мин</span></>}
                    {workout.bodyWeightAfter && <><span>•</span><span>{workout.bodyWeightAfter.toFixed(1)} кг</span></>}
                  </div>
                </button>

                {expandedId === workout.id && (

                    <button onClick={() => shareWorkout(workout)} className="btn btn-primary" style={{fontSize: '0.875rem', marginBottom: '0.5rem'}}>
                      <span>📤</span> Поделиться тренировкой
                    </button>
                    
                    {workout.exercises.map(ex => {
                      const exDef = exercises.find(e => e.id === ex.exerciseId);
                      const hasWeight = exDef ? checkExerciseHasWeight(exDef) : checkExerciseHasWeight(ex);

                      return (
                        <div key={ex.exerciseId} style={{background: '#f8fafc', borderRadius: '8px', padding: '1rem'}}>
                          <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.5rem'}}>
                            <h4 style={{fontWeight: 500, color: '#0f172a'}}>{ex.exerciseName}</h4>
                            <span style={{fontSize: '0.75rem', color: hasWeight ? '#2563eb' : '#059669', background: hasWeight ? '#eff6ff' : '#ecfdf5', padding: '0.15rem 0.4rem', borderRadius: '4px'}}>
                              {hasWeight ? 'С весом' : 'Без веса'}
                            </span>
                          </div>
                          <div style={{display: 'flex', flexDirection: 'column', gap: '0.25rem'}}>
                            {ex.sets.map((set, idx) => (
                              <div key={idx} style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: '0.875rem'}}>
                                <div>
                                  <span style={{color: '#64748b'}}>
                                    {idx + 1}. {hasWeight && set.weight > 0 ? `${set.weight} кг × ${set.reps} повт.` : `${set.reps} повт.`}
                                  </span>
                                  <span style={{fontSize: '0.75rem', color: '#94a3b8', marginLeft: '0.5rem'}}>
                                    {new Date(set.timestamp).toLocaleTimeString('ru-RU')}
                                  </span>
                                </div>
                                {set.mood && <span>{getMoodEmoji(set.mood)}</span>}
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}

                    {(workout.bodyWeightBefore || workout.bodyWeightAfter) && (
                      <div style={{background: '#eff6ff', borderRadius: '8px', padding: '1rem'}}>
                        <p style={{fontWeight: 500, color: '#0f172a', marginBottom: '0.25rem'}}>Вес тела:</p>
                        <p style={{fontSize: '0.875rem', color: '#64748b'}}>
                          {workout.bodyWeightBefore && `До: ${workout.bodyWeightBefore.toFixed(1)} кг`}
                          {workout.bodyWeightBefore && workout.bodyWeightAfter && ' → '}
                          {workout.bodyWeightAfter && `После: ${workout.bodyWeightAfter.toFixed(1)} кг`}
                        </p>
                      </div>
                    )}
                    
                    {workout.notes && (
                      <div style={{background: '#fef3c7', borderRadius: '8px', padding: '1rem'}}>
                        <p style={{fontWeight: 500, color: '#0f172a', marginBottom: '0.5rem'}}>📝 Заметки:</p>
                        <p style={{fontSize: '0.875rem', color: '#78350f', whiteSpace: 'pre-wrap'}}>{workout.notes}</p>
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
          
          {showShareModal && sharingWorkout && (
            <Modal onClose={() => setShowShareModal(false)} title="Поделиться тренировкой">
              <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                <textarea
                  value={generateWorkoutShareText(sharingWorkout)}
                  readOnly
                  style={{
                    width: '100%',
                    minHeight: '300px',
                    padding: '1rem',
                    borderRadius: '8px',
                    border: '1px solid #e2e8f0',
                    fontSize: '0.875rem',
                    fontFamily: 'monospace',
                    resize: 'vertical'

                  onClick={() => copyToClipboard(generateWorkoutShareText(sharingWorkout))} 
                  className="btn btn-primary"
                >
                  📋 Скопировать
                </button>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    function StatsTab({ workouts, exercises }) {
      const [selectedExerciseId, setSelectedExerciseId] = useState(null);
      const [showShareStatsModal, setShowShareStatsModal] = useState(false);

      const totalWorkouts = workouts.length;
      const totalSets = workouts.reduce((sum, w) => sum + w.exercises.reduce((s, e) => s + e.sets.length, 0), 0);
      const totalVolume = workouts.reduce(
        (sum, w) => sum + w.exercises.reduce((s, e) => s + e.sets.reduce((v, set) => v + (set.weight || 0) * set.reps, 0), 0),
        0
      );
      /* Изменено вычисление среднего настроения для шкалы 1-3 */
      const avgMood = workouts.filter(w => w.overallMood).length
        ? (workouts.filter(w => w.overallMood).reduce((sum, w) => sum + (w.overallMood || 0), 0) / workouts.filter(w => w.overallMood).length).toFixed(1)
        : 'N/A';
      /* </CHANGE> */
      
      const latestWeight = [...workouts].reverse().find(w => w.bodyWeightAfter)?.bodyWeightAfter || 
                           [...workouts].reverse().find(w => w.bodyWeightBefore)?.bodyWeightBefore;
      
      const totalMs = workouts.reduce((sum, w) => w.endDate ? sum + (new Date(w.endDate).getTime() - new Date(w.startDate).getTime()) : sum, 0);
      
      const totalHours = Math.floor(totalMs / 3600000);
      const totalMinutes = Math.floor((totalMs % 3600000) / 60000);
      const gymTimeDisplay = `${totalHours}ч ${totalMinutes}м`;

      const stats = [
        { label: 'Тренировок', value: totalWorkouts, icon: '💪', gradient: 'linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%)' },
        { label: 'Подходов', value: totalSets, icon: '📈', gradient: 'linear-gradient(135deg, #10b981 0%, #14b8a6 100%)' },
        { label: 'Поднято тонн', value: (totalVolume / 1000).toFixed(1), icon: '⚖️', gradient: 'linear-gradient(135deg, #a855f7 0%, #ec4899 100%)' },
        { label: 'Настроение', value: avgMood, icon: '❤️', gradient: 'linear-gradient(135deg, #f59e0b 0%, #f97316 100%)' },
        { label: 'Вес (кг)', value: latestWeight ? latestWeight.toFixed(1) : 'N/A', icon: '⚖️', gradient: 'linear-gradient(135deg, #f43f5e 0%, #dc2626 100%)' },
        { label: 'Время в зале', value: gymTimeDisplay, icon: '⏱️', gradient: 'linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%)' },
      ];

      const generateStatsShareText = () => {
        let text = `📊 GymFlow - Моя статистика\n\n`;
        text += `💪 Тренировок: ${totalWorkouts}\n`;
        text += `📈 Подходов: ${totalSets}\n`;
        text += `⚖️ Поднято тонн: ${(totalVolume / 1000).toFixed(1)}\n`;
        text += `⏱️ Время в зале: ${gymTimeDisplay}\n`;
        if (avgMood !== 'N/A') {
          text += `❤️ Среднее настроение: ${avgMood}/3\n`;
        }
        if (latestWeight) {
          text += `🎯 Текущий вес: ${latestWeight.toFixed(1)} кг\n`;
        }
        return text;
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text).then(() => {
          alert('📋 Скопировано в буфер обмена!');
        }).catch(() => {
          alert('Не удалось скопировать. Попробуйте снова.');
        });
      };

      const exercisesWithData = exercises.filter(ex => 
        workouts.some(w => w.exercises.some(e => e.exerciseId === ex.id && e.sets.length > 0))
      );

      const getExerciseChartData = (exerciseId) => {
        const data = [];
        workouts.forEach(w => {
          const ex = w.exercises.find(e => e.exerciseId === exerciseId);
          if (ex && ex.sets.length > 0) {
            data.push({
              date: new Date(w.startDate).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }),
              maxWeight: Math.max(...ex.sets.map(s => s.weight || 0)),
              maxReps: Math.max(...ex.sets.map(s => s.reps || 0)),
              volume: ex.sets.reduce((a, s) => a + (s.weight || 0) * s.reps, 0) / 1000
            });
          }
        });
        return data;
      };

      const getBodyWeightData = () => {
        return workouts
          .filter(w => w.bodyWeightBefore || w.bodyWeightAfter)
          .map(w => ({
            date: new Date(w.startDate).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }),
            before: w.bodyWeightBefore,
            after: w.bodyWeightAfter
          }));
      };

      const getMoodData = () => {
        return workouts
          .filter(w => w.overallMood)
          .map(w => ({
            date: new Date(w.startDate).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }),
            mood: w.overallMood
          }));
      };

      const selectedExerciseData = selectedExerciseId ? getExerciseChartData(selectedExerciseId) : [];
      const selectedExerciseDef = exercises.find(e => e.id === selectedExerciseId);
      const selectedExerciseName = selectedExerciseDef?.name;
      const isSelectedExerciseWithWeight = selectedExerciseDef ? checkExerciseHasWeight(selectedExerciseDef) : true;
      const bodyWeightData = getBodyWeightData();
      const moodData = getMoodData();

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2 className="card-title" style={{marginBottom: '1.5rem'}}>Статистика</h2>
              <button onClick={() => setShowShareStatsModal(true)} className="btn btn-primary" style={{fontSize: '0.875rem'}}>
                <span>📤</span> Поделиться
              </button>
            </div>
            
            <div className="grid" style={{marginBottom: '2rem'}}>
              {stats.map((stat, idx) => (
                <div key={idx} className="stat-card">
                  <div className="stat-icon" style={{background: stat.gradient}}>
                    {stat.icon}
                  </div>
                  <p className="stat-value">{stat.value}</p>
                  <p className="stat-label">{stat.label}</p>
                </div>
              ))}
            </div>

            {exercisesWithData.length > 0 && (
              <div className="form-group">
                <label className="label">Выберите упражнение для анализа</label>
                <select
                  value={selectedExerciseId || ''}
                  onChange={(e) => setSelectedExerciseId(e.target.value ? Number(e.target.value) : null)}
                  className="input"
                >
                  <option value="">-- Выберите упражнение --</option>
                  {exercisesWithData.map(ex => (
                    <option key={ex.id} value={ex.id}>{ex.name}</option>
                  ))}
                </select>
              </div>
            )}

            {selectedExerciseId && selectedExerciseData.length > 0 && (
              isSelectedExerciseWithWeight ? (
                <>
                  <div className="chart-container">
                    <h3 className="chart-title">{selectedExerciseName} – Рост рабочего веса</h3>
                    <LineChart data={selectedExerciseData} dataKey="maxWeight" color="#4f46e5" label="кг" />
                  </div>
                  <div className="chart-container">
                    <h3 className="chart-title">{selectedExerciseName} – Общий тоннаж</h3>
                    <LineChart data={selectedExerciseData} dataKey="volume" color="#a855f7" label="т" />
                  </div>
                </>
              ) : (
                <div className="chart-container">
                  <h3 className="chart-title">{selectedExerciseName} – Максимальные повторения</h3>
                  <LineChart data={selectedExerciseData} dataKey="maxReps" color="#059669" label="повт." />
                </div>
              )
            )}

            {bodyWeightData.length > 0 && (
              <div className="chart-container">
                <h3 className="chart-title">Динамика веса тела</h3>
                <DualLineChart data={bodyWeightData} />
              </div>
            )}

            {moodData.length > 0 && (
              <div className="chart-container">
                <h3 className="chart-title">Динамика самочувствия</h3>
                <MoodChart data={moodData} />
              </div>
            )}
          </div>
          
          {showShareStatsModal && (
            <Modal onClose={() => setShowShareStatsModal(false)} title="Поделиться статистикой">
              <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                <textarea
                  value={generateStatsShareText()}
                  readOnly
                  style={{
                    width: '100%',
                    minHeight: '200px',
                    padding: '1rem',
                    borderRadius: '8px',
                    border: '1px solid #e2e8f0',
                    fontSize: '0.875rem',
                    fontFamily: 'monospace',
                    resize: 'vertical'
                  }}
                />
                <button 
                  onClick={() => copyToClipboard(generateStatsShareText())} 
                  className="btn btn-primary"
                >
                  📋 Скопировать
                </button>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    /* Улучшенные графики для телефона с правильным отображением одиночных точек и подписями осей */
    function LineChart({ data, dataKey, color, label }) {
      if (data.length === 0) return null;

      const maxValue = Math.max(...data.map(p => p[dataKey]));
      const minValue = Math.min(...data.map(p => p[dataKey]));
      const range = maxValue - minValue || 1;

      const yAxisLabels = [];
      for (let i = 0; i <= 4; i++) {
        yAxisLabels.push((minValue + (range * i / 4)).toFixed(1));
      }

      // Для одной точки используем по центру
      const isSinglePoint = data.length === 1;

      return (
        <div style={{
          width: '100%',
          overflowX: isSinglePoint ? 'visible' : 'auto',
          WebkitOverflowScrolling: 'touch'
        }}>
          <svg 
            viewBox="0 0 900 380" 
            style={{
              width: isSinglePoint ? '100%' : `${Math.max(600, data.length * 100)}px`,
              height: '380px',
              minWidth: '300px'
            }}
          >
            {/* Подпись оси Y */}
            <text
              x="10"
              y="30"
              style={{fontSize: '14px', fill: '#475569', fontWeight: '600'}}
            >
              {label}
            </text>

            {/* Линии сетки и метки Y */}
            {yAxisLabels.map((labelValue, i) => (
              <g key={i}>
                <line
                  x1="70"
                  y1={320 - (i * 60)}
                  x2="870"
                  y2={320 - (i * 60)}
                  stroke="#e2e8f0"
                  strokeWidth="1"
                />
                <text
                  x="60"
                  y={325 - (i * 60)}
                  textAnchor="end"
                  style={{fontSize: '12px', fill: '#64748b', fontWeight: '500'}}
                >
                  {labelValue}
                </text>
              </g>
            ))}
            
            {isSinglePoint ? (
              <g>
                <circle cx={470} cy={320 - ((data[0][dataKey] - minValue) / range) * 240} r="8" fill={color} />
                <text
                  x={470}
                  y={320 - ((data[0][dataKey] - minValue) / range) * 240 - 20}
                  textAnchor="middle"
                  style={{fontSize: '14px', fill: '#0f172a', fontWeight: '700'}}
                >
                  {data[0][dataKey].toFixed(1)} {label}
                </text>
                <text
                  x={470}
                  y={360}
                  textAnchor="middle"
                  style={{fontSize: '12px', fill: '#64748b', fontWeight: '500'}}
                >
                  {data[0].date}
                </text>
              </g>
            ) : (
              <>
                <polyline
                  points={data.map((point, idx) => {
                    const x = 120 + (idx / (data.length - 1)) * 720;
                    const y = 320 - ((point[dataKey] - minValue) / range) * 240;
                    return `${x},${y}`;
                  }).join(' ')}
                  fill="none"
                  stroke={color}
                  strokeWidth="3"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
                
                {data.map((point, idx) => {
                  const x = 120 + (idx / (data.length - 1)) * 720;
                  const y = 320 - ((point[dataKey] - minValue) / range) * 240;
                  return (
                    <g key={idx}>
                      <circle cx={x} cy={y} r="6" fill={color} />
                      <text
                        x={x}
                        y={y - 18}
                        textAnchor="middle"
                        style={{fontSize: '13px', fill: '#0f172a', fontWeight: '700'}}
                      >
                        {point[dataKey].toFixed(1)}
                      </text>
                      <text
                        x={x}
                        y={360}
                        textAnchor="middle"
                        style={{fontSize: '11px', fill: '#64748b', fontWeight: '500'}}
                      >
                        {point.date}
                      </text>
                    </g>
                  );
                })}
              </>
            )}
          </svg>
        </div>
      );
    }

    function DualLineChart({ data }) {
      if (data.length === 0) return null;

      const allWeights = data.flatMap(p => [p.before, p.after].filter(Boolean));
      const minWeight = Math.min(...allWeights);
      const maxWeight = Math.max(...allWeights);
      const range = maxWeight - minWeight || 1;

      const yAxisLabels = [];
      for (let i = 0; i <= 4; i++) {
        yAxisLabels.push((minWeight + (range * i / 4)).toFixed(1));
      }

      const beforeData = data.filter(p => p.before);
      const afterData = data.filter(p => p.after);
      const isSinglePoint = data.length === 1;

      return (
        <div style={{
          width: '100%',
          overflowX: isSinglePoint ? 'visible' : 'auto',
          WebkitOverflowScrolling: 'touch'
        }}>
          <svg 
            viewBox="0 0 900 420" 
            style={{
              width: isSinglePoint ? '100%' : `${Math.max(600, data.length * 100)}px`,
              height: '420px',
              minWidth: '300px'
            }}
          >
            {/* Подпись оси Y */}
            <text
              x="10"
              y="30"
              style={{fontSize: '14px', fill: '#475569', fontWeight: '600'}}
            >
              кг
            </text>

            {/* Линии сетки и метки Y */}
            {yAxisLabels.map((labelValue, i) => (
              <g key={i}>
                <line
                  x1="70"
                  y1={320 - (i * 60)}
                  x2="870"
                  y2={320 - (i * 60)}
                  stroke="#e2e8f0"
                  strokeWidth="1"
                />
                <text
                  x="60"
                  y={325 - (i * 60)}
                  textAnchor="end"
                  style={{fontSize: '12px', fill: '#64748b', fontWeight: '500'}}
                >
                  {labelValue}
                </text>
              </g>
            ))}
            
            {/* Before weight */}
            {beforeData.length === 1 ? (
              <g>
                <circle 
                  cx={470}
                  cy={320 - ((beforeData[0].before - minWeight) / range) * 240}
                  r="6" 
                  fill="#10b981" 
                />
                <text
                  x={470}
                  y={320 - ((beforeData[0].before - minWeight) / range) * 240 + 25}
                  textAnchor="middle"
                  style={{fontSize: '13px', fill: '#047857', fontWeight: '700'}}
                >
                  {beforeData[0].before.toFixed(1)}
                </text>
              </g>
            ) : beforeData.length > 1 && (
              <>
                <polyline
                  points={beforeData.map((point) => {
                    const idx = data.indexOf(point);
                    const x = 120 + (idx / (data.length - 1)) * 720;
                    const y = 320 - ((point.before - minWeight) / range) * 240;
                    return `${x},${y}`;
                  }).join(' ')}
                  fill="none"
                  stroke="#10b981"
                  strokeWidth="3"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
                {beforeData.map((point) => {
                  const idx = data.indexOf(point);
                  const x = 120 + (idx / (data.length - 1)) * 720;
                  const y = 320 - ((point.before - minWeight) / range) * 240;
                  return (
                    <g key={`before-${idx}`}>
                      <circle cx={x} cy={y} r="5" fill="#10b981" />
                      <text
                        x={x}
                        y={y + 22}
                        textAnchor="middle"
                        style={{fontSize: '12px', fill: '#047857', fontWeight: '700'}}
                      >
                        {point.before.toFixed(1)}
                      </text>
                    </g>
                  );
                })}
              </>
            )}
            
            {/* After weight */}
            {afterData.length === 1 ? (
              <g>
                <circle 
                  cx={470}
                  cy={320 - ((afterData[0].after - minWeight) / range) * 240}
                  r="6" 
                  fill="#f43f5e" 
                />
                <text
                  x={470}
                  y={320 - ((afterData[0].after - minWeight) / range) * 240 - 15}
                  textAnchor="middle"
                  style={{fontSize: '13px', fill: '#be123c', fontWeight: '700'}}
                >
                  {afterData[0].after.toFixed(1)}
                </text>
              </g>
            ) : afterData.length > 1 && (
              <>
                <polyline
                  points={afterData.map((point) => {
                    const idx = data.indexOf(point);
                    const x = 120 + (idx / (data.length - 1)) * 720;
                    const y = 320 - ((point.after - minWeight) / range) * 240;
                    return `${x},${y}`;
                  }).join(' ')}
                  fill="none"
                  stroke="#f43f5e"
                  strokeWidth="3"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  strokeDasharray="5,5"
                />
                {afterData.map((point) => {
                  const idx = data.indexOf(point);
                  const x = 120 + (idx / (data.length - 1)) * 720;
                  const y = 320 - ((point.after - minWeight) / range) * 240;
                  return (
                    <g key={`after-${idx}`}>
                      <circle cx={x} cy={y} r="5" fill="#f43f5e" />
                      <text
                        x={x}
                        y={y - 15}
                        textAnchor="middle"
                        style={{fontSize: '12px', fill: '#be123c', fontWeight: '700'}}
                      >
                        {point.after.toFixed(1)}
                      </text>
                    </g>
                  );
                })}
              </>
            )}

            {/* Подписи дат */}
            {data.map((point, idx) => {
              const x = isSinglePoint ? 470 : 120 + (idx / (data.length - 1)) * 720;
              return (
                <text
                  key={idx}
                  x={x}
                  y={360}
                  textAnchor="middle"
                  style={{fontSize: '11px', fill: '#64748b', fontWeight: '500'}}
                >
                  {point.date}
                </text>
              );
            })}
          </svg>
          
          <div style={{display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.5rem', marginTop: '1rem'}}>
            <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
              <div style={{width: '20px', height: '3px', background: '#10b981'}}></div>
              <span style={{fontSize: '0.875rem', color: '#64748b'}}>До тренировки</span>
            </div>
            <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
              <div style={{width: '20px', height: '3px', background: '#f43f5e', borderTop: '3px dashed #f43f5e'}}></div>
              <span style={{fontSize: '0.875rem', color: '#64748b'}}>После тренировки</span>
            </div>
          </div>
        </div>
      );
    }

      const isSinglePoint = data.length === 1;

      return (
        <div style={{
          width: '100%',
          overflowX: isSinglePoint ? 'visible' : 'auto',
          WebkitOverflowScrolling: 'touch'
        }}>
          <svg 
            viewBox="0 0 900 380" 
            style={{
              width: isSinglePoint ? '100%' : `${Math.max(600, data.length * 100)}px`,
              height: '380px',
              minWidth: '300px'
            }}
          >
            {/* Подпись оси Y */}
            <text
              x="10"
              y="30"
              style={{fontSize: '14px', fill: '#475569', fontWeight: '600'}}
            >
              Самочувствие

            {[1, 2, 3].map(i => (

                    <stop offset="100%" style={{stopColor: '#10b981'}} />
                  </linearGradient>
                </defs>
                <polyline
                  points={data.map((point, idx) => {
                    const x = 120 + (idx / (data.length - 1)) * 720;
                    const y = 320 - ((point.mood - 1) / 2) * 240;
                    return `${x},${y}`;
                  }).join(' ')}
                  fill="none"
                  stroke="url(#moodGradient)"
                  strokeWidth="3"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                />
                
                {data.map((point, idx) => {

    function SettingsTab({ exercises, userSettings, onSaveUserSettings, onAddExercise, onDeleteExercise, onExportData, onImportData, onResetData }) {
      const [newExerciseName, setNewExerciseName] = useState('');
      const [newExerciseCategory, setNewExerciseCategory] = useState('');
      const [customCategory, setCustomCategory] = useState('');
      const [newExerciseHasWeight, setNewExerciseHasWeight] = useState(true);
      const [libraryFilter, setLibraryFilter] = useState('all'); // 'all', 'system', 'user'
      const [librarySearch, setLibrarySearch] = useState('');
      const [showLibraryModal, setShowLibraryModal] = useState(false);

      // Значения по умолчанию
      const [defaultWeightInput, setDefaultWeightInput] = useState(String(userSettings?.defaultWeight || 50));
      const [defaultRepsInput, setDefaultRepsInput] = useState(String(userSettings?.defaultReps || 10));
      const [defaultRestTimeInput, setDefaultRestTimeInput] = useState(String(userSettings?.defaultRestTime || 90));

      const saveUserDefaults = () => {
        const weight = parseFloat(defaultWeightInput.replace(',', '.')) || 0;
        const reps = parseInt(defaultRepsInput, 10) || 10;
        const restTime = parseInt(defaultRestTimeInput, 10) || 90;
        
        onSaveUserSettings({
          defaultWeight: Math.max(0, weight),
          defaultReps: Math.max(1, reps),
          defaultRestTime: Math.max(5, restTime)
        });
      };

      const addExercise = () => {
        const name = newExerciseName.trim();
        if (!name) {
          alert('Введите название упражнения');
          return;
        }

        const existing = exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
        if (existing) {
          alert(`ℹ️ Упражнение «${existing.name}» уже есть в базе в категории «${existing.group}» (${existing.system ? 'базовое' : 'пользовательское'})!\n\nВы можете сразу выбрать его во время тренировки или в шаблоне.`);
          return;
        }
        
        const category = newExerciseCategory === 'custom' ? customCategory.trim() || 'Пользовательские' : newExerciseCategory || 'Пользовательские';
        
        onAddExercise(name, category, newExerciseHasWeight);
        setNewExerciseName('');
        setNewExerciseCategory('');
        setCustomCategory('');
        setNewExerciseHasWeight(true);
        alert(`Упражнение «${name}» добавлено в категорию «${category}» (${newExerciseHasWeight ? 'с весом' : 'без веса'})!`);
      };

      const availableCategories = Object.keys(exerciseDatabase);

      const filteredExercises = exercises.filter(ex => {
        if (libraryFilter === 'system' && !ex.system) return false;
        if (libraryFilter === 'user' && ex.system) return false;
        if (librarySearch.trim()) {
          const q = librarySearch.trim().toLowerCase();
          return ex.name.toLowerCase().includes(q) || (ex.group && ex.group.toLowerCase().includes(q));
        }
        return true;
      });

      return (
        <div>
          <div className="card">
            <h2 className="card-title" style={{marginBottom: '1.5rem'}}>Настройки</h2>

            <div style={{display: 'flex', flexDirection: 'column', gap: '2rem'}}>
              
              {/* Значения по умолчанию */}
              <div style={{background: '#f8fafc', padding: '1.25rem', borderRadius: '12px', border: '1px solid #e2e8f0'}}>
                <h3 style={{fontSize: '1.125rem', fontWeight: 600, color: '#0f172a', marginBottom: '0.5rem'}}>
                  ⚙️ Значения по умолчанию
                </h3>
                <p style={{fontSize: '0.875rem', color: '#64748b', marginBottom: '1.25rem'}}>
                  Будут автоматически подставляться при добавлении новых подходов и таймера:
                </p>

                <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                  <div className="form-group" style={{marginBottom: 0}}>
                    <label className="label">Вес по умолчанию (кг) — можно с точкой или запятой</label>
                    <input
                      type="text"
                      inputMode="decimal"
                      value={defaultWeightInput}
                      onChange={e => {
                        const val = e.target.value.replace(',', '.');
                        if (val === '' || /^\d*\.?\d*$/.test(val)) setDefaultWeightInput(val);
                      }}
                      className="input"
                      placeholder="50"
                    />
                  </div>

                  <div className="form-group" style={{marginBottom: 0}}>
                    <label className="label">Повторения по умолчанию</label>
                    <input
                      type="number"
                      min="1"
                      value={defaultRepsInput}
                      onChange={e => setDefaultRepsInput(e.target.value)}
                      className="input"
                      placeholder="10"
                    />
                  </div>

                  <div className="form-group" style={{marginBottom: 0}}>
                    <label className="label">Время отдыха между подходами (секунды)</label>
                    <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
                      <input
                        type="number"
                        min="5"
                        step="5"
                        value={defaultRestTimeInput}
                        onChange={e => setDefaultRestTimeInput(e.target.value)}
                        className="input"
                        style={{flex: 1, minWidth: '120px'}}
                        placeholder="90"
                      />
                      <div style={{display: 'flex', gap: '0.25rem'}}>
                        <button type="button" onClick={() => setDefaultRestTimeInput('60')} className="btn btn-secondary" style={{fontSize: '0.8125rem', padding: '0.5rem 0.75rem'}}>
                          60с
                        </button>
                        <button type="button" onClick={() => setDefaultRestTimeInput('90')} className="btn btn-secondary" style={{fontSize: '0.8125rem', padding: '0.5rem 0.75rem'}}>
                          90с
                        </button>
                        <button type="button" onClick={() => setDefaultRestTimeInput('120')} className="btn btn-secondary" style={{fontSize: '0.8125rem', padding: '0.5rem 0.75rem'}}>
                          120с
                        </button>
                      </div>
                    </div>
                  </div>

                  <button onClick={saveUserDefaults} className="btn btn-primary" style={{alignSelf: 'flex-start', marginTop: '0.5rem'}}>
                    💾 Сохранить значения по умолчанию
                  </button>
                </div>
              </div>

              {/* Библиотека упражнений и добавление нового */}
              <div>
                <h3 style={{fontSize: '1.125rem', fontWeight: 600, color: '#0f172a', marginBottom: '1rem'}}>Библиотека упражнений</h3>
                
                <div style={{display: 'flex', flexDirection: 'column', gap: '0.75rem', marginBottom: '1.5rem', background: '#f8fafc', padding: '1rem', borderRadius: '12px', border: '1px solid #e2e8f0'}}>
                  <h4 style={{fontSize: '0.9375rem', fontWeight: 600, color: '#334155'}}>Добавить новое упражнение</h4>
                  
                  <input
                    type="text"
                    value={newExerciseName}
                    onChange={e => setNewExerciseName(e.target.value)}
                    placeholder="Название упражнения"
                    onKeyDown={e => e.key === 'Enter' && addExercise()}
                    className="input"
                  />
                  
                  <select
                    value={newExerciseCategory}
                    onChange={e => setNewExerciseCategory(e.target.value)}
                    className="input"
                  >
                    <option value="">Выберите категорию</option>
                    {availableCategories.map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                    <option value="custom">+ Создать новую категорию</option>
                  </select>
                  
                  {newExerciseCategory === 'custom' && (
                    <input
                      type="text"
                      value={customCategory}
                      onChange={e => setCustomCategory(e.target.value)}
                      placeholder="Название новой категории"
                      className="input"
                    />
                  )}

                  {/* Выбор: с весом или без веса */}
                  <div style={{display: 'flex', flexDirection: 'column', gap: '0.25rem', marginTop: '0.25rem'}}>
                    <label style={{display: 'flex', alignItems: 'center', gap: '0.625rem', cursor: 'pointer', fontSize: '0.9375rem', color: '#0f172a'}}>
                      <input
                        type="checkbox"
                        checked={newExerciseHasWeight}
                        onChange={e => setNewExerciseHasWeight(e.target.checked)}
                        style={{width: '18px', height: '18px', cursor: 'pointer'}}
                      />
                      <span>Упражнение с весом (отягощением)</span>
                    </label>
                    <span style={{fontSize: '0.75rem', color: '#64748b', marginLeft: '1.75rem'}}>
                      {newExerciseHasWeight ? 'Будет учитываться вес штанги/гантелей/тренажера' : 'Только повторения (подтягивания, пресс, собственный вес)'}
                    </span>
                  </div>
                  
                  <button onClick={addExercise} className="btn btn-primary" style={{alignSelf: 'flex-start', marginTop: '0.5rem'}}>
                    <span>➕</span> Добавить упражнение
                  </button>
                </div>

                {/* Поиск и список всех упражнений прямо в настройках */}
                <div style={{display: 'flex', flexDirection: 'column', gap: '0.75rem'}}>
                  <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0.5rem'}}>
                    <h4 style={{fontSize: '0.9375rem', fontWeight: 600, color: '#334155'}}>
                      Список упражнений ({exercises.length})

                    <div style={{display: 'flex', gap: '0.25rem'}}>
                      <button 
                        type="button" 
                        onClick={() => setLibraryFilter('all')} 
                        className="btn btn-secondary" 
                        style={{fontSize: '0.75rem', padding: '0.25rem 0.5rem', background: libraryFilter === 'all' ? '#2563eb' : '#f1f5f9', color: libraryFilter === 'all' ? 'white' : '#475569'}}
                      >
                        Все ({exercises.length})
                      </button>
                      <button 
                        type="button" 
                        onClick={() => setLibraryFilter('system')} 
                        className="btn btn-secondary" 
                        style={{fontSize: '0.75rem', padding: '0.25rem 0.5rem', background: libraryFilter === 'system' ? '#2563eb' : '#f1f5f9', color: libraryFilter === 'system' ? 'white' : '#475569'}}
                      >
                        Базовые ({exercises.filter(e => e.system).length})
                      </button>
                      <button 
                        type="button" 
                        onClick={() => setLibraryFilter('user')} 
                        className="btn btn-secondary" 
                        style={{fontSize: '0.75rem', padding: '0.25rem 0.5rem', background: libraryFilter === 'user' ? '#2563eb' : '#f1f5f9', color: libraryFilter === 'user' ? 'white' : '#475569'}}

                        Мои ({exercises.filter(e => !e.system).length})
                      </button>
                    </div>
                  </div>

                  <input
                    type="text"
                    value={librarySearch}
                    onChange={e => setLibrarySearch(e.target.value)}
                    placeholder="🔍 Поиск по базе (например: становая тяга, жим)..."
                    className="input"
                    style={{fontSize: '0.875rem'}}
                  />

                  <div style={{maxHeight: '350px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.5rem', border: '1px solid #e2e8f0', borderRadius: '8px', padding: '0.5rem'}}>

                      <p style={{padding: '1rem', textAlign: 'center', color: '#64748b', fontSize: '0.875rem'}}>

                      filteredExercises.map(ex => {
                        const hasWeight = checkExerciseHasWeight(ex);
                        return (
                          <div key={ex.id} style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.625rem 0.75rem', background: '#f8fafc', borderRadius: '8px', gap: '0.5rem'}}>
                            <div style={{flex: 1}}>
                              <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap'}}>
                                <span style={{fontWeight: 500, color: '#0f172a', fontSize: '0.9375rem'}}>{ex.name}</span>
                                <span style={{fontSize: '0.6875rem', color: '#64748b', background: '#e2e8f0', padding: '0.125rem 0.375rem', borderRadius: '4px'}}>
                                  {ex.group}
                                </span>
                                <span style={{fontSize: '0.6875rem', color: hasWeight ? '#2563eb' : '#059669', background: hasWeight ? '#eff6ff' : '#ecfdf5', padding: '0.125rem 0.375rem', borderRadius: '4px', fontWeight: 500}}>

                                  <span style={{fontSize: '0.6875rem', color: '#64748b', background: '#f1f5f9', padding: '0.125rem 0.375rem', borderRadius: '4px'}}>

                                  </span>

                                  <span style={{fontSize: '0.6875rem', color: '#7c3aed', background: '#f5f3ff', padding: '0.125rem 0.375rem', borderRadius: '4px'}}>

              {/* Управление данными */}
              <div>
                <h3 style={{fontSize: '1.125rem', fontWeight: 600, color: '#0f172a', marginBottom: '1rem'}}>Управление данными</h3>

                  <button onClick={onExportData} className="btn btn-secondary" style={{justifyContent: 'center'}}>
                    <span>💾</span> Экспорт данных
                  </button>
                  <button onClick={onImportData} className="btn btn-secondary" style={{justifyContent: 'center'}}>
                    <span>📥</span> Импорт данных
                  </button>
                  <button onClick={onResetData} className="btn btn-danger" style={{justifyContent: 'center'}}>
                    <span>🗑️</span> Сбросить все данные
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>
      );

    function Modal({ onClose, title, children }) {
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 className="modal-title">{title}</h3>
              <button onClick={onClose} className="modal-close">✖️</button>
            </div>
