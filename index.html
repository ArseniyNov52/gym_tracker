<body>
  <div id="root"></div>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const exerciseDatabase = {
      'Грудь': ['Жим штанги лежа','Жим штанги на наклонной скамье','Жим гантелей лежа','Разводка гантелей лежа','Отжимания от пола','Сведение рук в тренажере «Бабочка»','Кроссоверы'],
      'Спина': ['Подтягивания','Становая тяга','Тяга штанги в наклоне','Тяга верхнего блока к груди','Гиперэкстензия','Шраги со штангой'],
      'Ноги': ['Приседания со штангой','Жим ногами','Выпады с гантелями','Разгибания ног в тренажере','Сгибания ног в тренажере','Подъемы на носки'],
      'Плечи': ['Армейский жим','Жим гантелей сидя','Махи гантелей в стороны','Махи в наклоне','Тяга штанги к подбородку'],
      'Бицепс': ['Подъем штанги на бицепс','Подъем гантелей на бицепс','Сгибания «молот»','Сгибания на скамье Скотта'],
      'Трицепс': ['Жим лежа узким хватом','Французский жим','Разгибания на блоке','Отжимания на брусьях'],
      'Пресс': ['Скручивания','Подъем ног в висе','Планка','Молитва на блоке']
    };

    // Список упражнений с собственным весом (без отягощения по умолчанию)
    const DEFAULT_NO_WEIGHT_EXERCISES = [
      'Подтягивания',
      'Отжимания от пола',
      'Отжимания на брусьях',
      'Гиперэкстензия',
      'Скручивания',
      'Подъем ног в висе',
      'Планка',
      'Молитва на блоке'
    ];

    function checkExerciseHasWeight(exercise) {
      if (!exercise) return true;
      if (typeof exercise.hasWeight === 'boolean') {
        return exercise.hasWeight;
      }
      if (exercise.group === 'Пресс') return false;
      if (DEFAULT_NO_WEIGHT_EXERCISES.includes(exercise.name || exercise.exerciseName)) return false;
      return true;
    }

    // Звуковой сигнал завершения таймера через Web Audio API (без внешних файлов)
    function playTimerSound() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const playBeep = (freq, time, dur) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, time);
          gain.gain.setValueAtTime(0.25, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
          osc.start(time);
          osc.stop(time + dur);
        };
        playBeep(880, ctx.currentTime, 0.2);
        playBeep(1174.66, ctx.currentTime + 0.22, 0.35);
      } catch (e) {
        // Контекст аудио может ожидать жеста пользователя
      }
    }

    const ACHIEVEMENT_CATEGORIES = [
      {name: 'Постоянство', achievements: [
        {id: 'c1', title: 'Новичок', description: 'Завершить 1 тренировку', icon: '🌱'},
        {id: 'c10', title: 'Привычка', description: 'Завершить 10 тренировок', icon: '💪'},
        {id: 'c50', title: 'Работяга', description: 'Завершить 50 тренировок', icon: '🔥'},
        {id: 'c100', title: 'Ветеран зала', description: 'Завершить 100 тренировок', icon: '🏆'},
        {id: 'c200', title: 'Железная дисциплина', description: 'Завершить 200 тренировок', icon: '⚡'},
        {id: 'c400', title: 'Мастер тренажёрного зала', description: 'Завершить 400 тренировок', icon: '🔱'},
        {id: 'c800', title: 'Легенда спорта', description: 'Завершить 800 тренировок', icon: '👑'}
      ]},
      {name: 'Вес на тренировках', achievements: [
        {id: 'v1t', title: 'Первая тонна', description: 'Поднять >1 т за тренировку', icon: '🏋️'},
        {id: 'v2t', title: 'Двойная сила', description: 'Поднять >2 т за тренировку', icon: '💪'},
        {id: 'v5t', title: 'Силач', description: 'Поднять >5 т за тренировку', icon: '🦬'},
        {id: 'v10t', title: 'Титан', description: 'Поднять >10 т за тренировку', icon: '⚡'},
        {id: 'v20t', title: 'Геркулес', description: 'Поднять >20 т за тренировку', icon: '🔥'},
        {id: 'v40t', title: 'Сверхчеловек', description: 'Поднять >40 т за тренировку', icon: '💎'}
      ]},
      {name: 'Общий поднятый вес', achievements: [
        {id: 't50t', title: 'Начинающий атлет', description: 'Общий тоннаж >50 т', icon: '🎯'},
        {id: 't100t', title: 'Тонный клуб', description: 'Общий тоннаж >100 т', icon: '🏭'},
        {id: 't250t', title: 'Стальной характер', description: 'Общий тоннаж >250 т', icon: '🔨'},
        {id: 't500t', title: 'Архитектор тела', description: 'Общий тоннаж >500 т', icon: '🏛️'},
        {id: 't1000t', title: 'Покоритель вершин', description: 'Общий тоннаж >1000 т', icon: '🏔️'}
      ]},
      {name: 'Проведенное время в зале', achievements: [
        {id: 'time5h', title: 'Первые шаги', description: 'Провести >5 часов в зале', icon: '⏱️'},
        {id: 'time20h', title: 'Завсегдатай', description: 'Провести >20 часов в зале', icon: '🕐'},
        {id: 'time50h', title: 'Преданный фитнесу', description: 'Провести >50 часов в зале', icon: '⏰'},
        {id: 'time100h', title: 'Марафонец', description: 'Провести >100 часов в зале', icon: '⌚'},
        {id: 'time250h', title: 'Храм силы', description: 'Провести >250 часов в зале', icon: '🏛️'},
        {id: 'time500h', title: 'Железная жизнь', description: 'Провести >500 часов в зале', icon: '💫'}
      ]}
    ];


    function App() {
      const [activeTab, setActiveTab] = useState('workout');
      const [exercises, setExercises] = useState([]);
      const [workouts, setWorkouts] = useState([]);
      const [templates, setTemplates] = useState([]);
      const [currentWorkout, setCurrentWorkout] = useState(null);
      const [timerSeconds, setTimerSeconds] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [unlockedAchievements, setUnlockedAchievements] = useState([]);
      const [goals, setGoals] = useState([]);

      // Пользовательские настройки по умолчанию
      const [userSettings, setUserSettings] = useState(() => {
        const saved = localStorage.getItem('gym_settings');
        return saved ? JSON.parse(saved) : {
          defaultWeight: 50,
          defaultReps: 10,
          defaultRestTime: 90
        };
      });

      // Глобальный таймер отдыха (работает на всех вкладках и при закрытии/сворачивании)
      const [restTimer, setRestTimer] = useState(() => {
        const savedRunning = localStorage.getItem('gym_rest_running') === 'true';
        const savedTarget = parseInt(localStorage.getItem('gym_rest_target') || '0', 10);
        const savedTotal = parseInt(localStorage.getItem('gym_rest_total') || '90', 10);
        const savedExercise = localStorage.getItem('gym_rest_exercise') || '';
        
        if (savedRunning && savedTarget > Date.now()) {
          return {
            isRunning: true,
            targetTime: savedTarget,
            totalDuration: savedTotal,
            exerciseName: savedExercise,
            remainingSeconds: Math.ceil((savedTarget - Date.now()) / 1000)
          };
        }
        return {
          isRunning: false,
          targetTime: 0,
          totalDuration: 90,
          exerciseName: '',
          remainingSeconds: 0
        };
      });

      /* Улучшенный таймер тренировки с поддержкой работы в фоновом режиме */
      const timerStartTimeRef = useRef(null);
      const lastUpdateRef = useRef(Date.now());

      useEffect(() => {
        let interval;
        if (isTimerRunning && currentWorkout) {
          if (!timerStartTimeRef.current) {
            timerStartTimeRef.current = Date.now() - (timerSeconds * 1000);
          }

          interval = setInterval(() => {
            const now = Date.now();
            const elapsed = Math.floor((now - timerStartTimeRef.current) / 1000);
            setTimerSeconds(elapsed);
            lastUpdateRef.current = now;
          }, 1000);

          const handleVisibilityChange = () => {
            if (!document.hidden && isTimerRunning) {
              const now = Date.now();
              const elapsed = Math.floor((now - timerStartTimeRef.current) / 1000);
              setTimerSeconds(elapsed);
            }
          };

          document.addEventListener('visibilitychange', handleVisibilityChange);

          return () => {
            clearInterval(interval);
            document.removeEventListener('visibilitychange', handleVisibilityChange);
          };
        } else {
          timerStartTimeRef.current = null;
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, currentWorkout]);

      // Обработка таймера отдыха с сохранением в фоновом режиме и при выходе с сайта
      useEffect(() => {
        let interval;
        if (restTimer.isRunning) {
          interval = setInterval(() => {
            const now = Date.now();
            const diff = Math.ceil((restTimer.targetTime - now) / 1000);
            if (diff <= 0) {
              setRestTimer(prev => ({
                ...prev,
                isRunning: false,
                remainingSeconds: 0
              }));
              localStorage.removeItem('gym_rest_running');
              localStorage.removeItem('gym_rest_target');
              playTimerSound();
              if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
              alert('⏰ Время отдыха закончилось! Готовы к следующему подходу?');
            } else {
              setRestTimer(prev => ({
                ...prev,
                remainingSeconds: diff
              }));
            }
          }, 500);

          const handleVisibility = () => {
            if (!document.hidden && restTimer.isRunning) {
              const now = Date.now();
              const diff = Math.ceil((restTimer.targetTime - now) / 1000);
              if (diff <= 0) {
                setRestTimer(prev => ({
                  ...prev,
                  isRunning: false,
                  remainingSeconds: 0
                }));
                localStorage.removeItem('gym_rest_running');
                localStorage.removeItem('gym_rest_target');
                playTimerSound();
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                alert('⏰ Время отдыха закончилось! Готовы к следующему подходу?');
              } else {
                setRestTimer(prev => ({
                  ...prev,
                  remainingSeconds: diff
                }));
              }
            }
          };

          document.addEventListener('visibilitychange', handleVisibility);
          return () => {
            clearInterval(interval);
            document.removeEventListener('visibilitychange', handleVisibility);
          };
        }
        return () => clearInterval(interval);
      }, [restTimer.isRunning, restTimer.targetTime]);

      const startRestTimer = (seconds, exerciseName = '') => {
        const duration = Math.max(5, seconds || userSettings.defaultRestTime || 90);
        const targetTime = Date.now() + duration * 1000;
        
        localStorage.setItem('gym_rest_running', 'true');
        localStorage.setItem('gym_rest_target', targetTime.toString());
        localStorage.setItem('gym_rest_total', duration.toString());
        localStorage.setItem('gym_rest_exercise', exerciseName);
        
        setRestTimer({
          isRunning: true,
          targetTime,
          totalDuration: duration,
          exerciseName,
          remainingSeconds: duration
        });
      };

      const adjustRestTimer = (deltaSeconds) => {
        if (!restTimer.isRunning) return;
        const newTarget = restTimer.targetTime + deltaSeconds * 1000;
        const newRemaining = Math.max(0, Math.ceil((newTarget - Date.now()) / 1000));
        if (newRemaining <= 0) {
          stopRestTimer();
        } else {
          localStorage.setItem('gym_rest_target', newTarget.toString());
          setRestTimer(prev => ({
            ...prev,
            targetTime: newTarget,
            remainingSeconds: newRemaining
          }));
        }
      };

      const stopRestTimer = () => {
        localStorage.removeItem('gym_rest_running');
        localStorage.removeItem('gym_rest_target');
        setRestTimer(prev => ({
          ...prev,
          isRunning: false,
          remainingSeconds: 0
        }));
      };

      useEffect(() => {
        const initExercises = [];
        let id = 1;
        for (const [group, exList] of Object.entries(exerciseDatabase)) {
          exList.forEach(name => {
            const hasWeight = group !== 'Пресс' && !DEFAULT_NO_WEIGHT_EXERCISES.includes(name);
            initExercises.push({
              id: id++,
              name,
              group,
              hasWeight,
              system: true
            });
          });
        }
        
        const saved = localStorage.getItem('gym_exercises');
        if (saved) {
          const userExercises = JSON.parse(saved).filter(ex => !ex.system);
          userExercises.forEach(ex => {
            const hasWeight = ex.hasWeight !== undefined ? ex.hasWeight : (ex.group !== 'Пресс' && !DEFAULT_NO_WEIGHT_EXERCISES.includes(ex.name));
            initExercises.push({ ...ex, hasWeight, id: id++ });
          });
        }
        
        setExercises(initExercises);
        
        let loadedWorkouts = [];
        const savedWorkouts = localStorage.getItem('gym_workouts');
        if (savedWorkouts) {
          loadedWorkouts = JSON.parse(savedWorkouts);
          setWorkouts(loadedWorkouts);
        }
        
        const savedTemplates = localStorage.getItem('gym_templates');
        if (savedTemplates) setTemplates(JSON.parse(savedTemplates));

        let currentUnlocked = [];
        const savedAchievements = localStorage.getItem('gym_achievements');
        if (savedAchievements) {
          currentUnlocked = JSON.parse(savedAchievements);
        }

        // Автоматическая проверка достижений при загрузке (чтобы Новичок и другие выдались тем, кто уже завершил тренировки)
        if (loadedWorkouts.length > 0) {
          const newlyUnlocked = [...currentUnlocked];
          if (loadedWorkouts.length >= 1 && !newlyUnlocked.includes('c1')) newlyUnlocked.push('c1');
          if (loadedWorkouts.length >= 10 && !newlyUnlocked.includes('c10')) newlyUnlocked.push('c10');
          if (loadedWorkouts.length >= 50 && !newlyUnlocked.includes('c50')) newlyUnlocked.push('c50');
          if (loadedWorkouts.length >= 100 && !newlyUnlocked.includes('c100')) newlyUnlocked.push('c100');
          currentUnlocked = newlyUnlocked;
          localStorage.setItem('gym_achievements', JSON.stringify(currentUnlocked));
        }
        setUnlockedAchievements(currentUnlocked);
        
        const savedGoals = localStorage.getItem('gym_goals');
        if (savedGoals) setGoals(JSON.parse(savedGoals));

        // Восстановление текущей тренировки
        const savedCurrentWorkout = localStorage.getItem('gym_current_workout');
        if (savedCurrentWorkout) {
          const workout = JSON.parse(savedCurrentWorkout);
          setCurrentWorkout(workout);
          
          const savedTimerSeconds = localStorage.getItem('gym_timer_seconds');
          const savedTimerStartTime = localStorage.getItem('gym_timer_start_time');
          
          if (savedTimerStartTime) {
            const startTime = parseInt(savedTimerStartTime);
            const now = Date.now();
            const elapsed = Math.floor((now - startTime) / 1000);
            timerStartTimeRef.current = startTime;
            setTimerSeconds(elapsed);
            setIsTimerRunning(true);
          }
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('gym_exercises', JSON.stringify(exercises.filter(e => !e.system)));
        localStorage.setItem('gym_workouts', JSON.stringify(workouts));
        localStorage.setItem('gym_templates', JSON.stringify(templates));
        localStorage.setItem('gym_achievements', JSON.stringify(unlockedAchievements));
        localStorage.setItem('gym_goals', JSON.stringify(goals));

        // Сохранение текущей тренировки
        if (currentWorkout) {
          localStorage.setItem('gym_current_workout', JSON.stringify(currentWorkout));
          localStorage.setItem('gym_timer_seconds', timerSeconds.toString());
          if (timerStartTimeRef.current) {
            localStorage.setItem('gym_timer_start_time', timerStartTimeRef.current.toString());
          }
        } else {
          localStorage.removeItem('gym_current_workout');
          localStorage.removeItem('gym_timer_seconds');
          localStorage.removeItem('gym_timer_start_time');
        }
      }, [exercises, workouts, templates, unlockedAchievements, goals, currentWorkout, timerSeconds]);
      // </CHANGE>

      const formatTime = (seconds) => {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const startNewWorkout = () => {
        const workout = {
          id: Date.now(),
          startDate: new Date().toISOString(),
          endDate: null,
          templateName: 'Свободная тренировка',
          bodyWeightBefore: null,
          bodyWeightAfter: null,
          overallMood: null,
          notes: '',
          exercises: []
        };
        setCurrentWorkout(workout);
        setIsTimerRunning(true);
        setTimerSeconds(0); // Reset timer for new workout
      };

      const startFromTemplate = (templateId) => {
        const template = templates.find(t => t.id === templateId);
        if (!template) return;

        const workout = {
          id: Date.now(),
          startDate: new Date().toISOString(),
          endDate: null,
          templateName: template.name,
          bodyWeightBefore: null,
          bodyWeightAfter: null,
          overallMood: null,
          notes: '',
          exercises: template.exercises.map(ex => ({
            exerciseId: ex.exerciseId,
            exerciseName: ex.exerciseName,
            sets: [],
            restTime: ex.restTime
          }))
        };
        setCurrentWorkout(workout);
        setIsTimerRunning(true);
        setTimerSeconds(0); // Reset timer for new workout
        setActiveTab('workout');
      };

      /* Добавлена функция отмены тренировки */
      const cancelWorkout = () => {
        if (!currentWorkout) return;
        
        if (confirm('⚠️ Отменить тренировку?\n\nВсе данные текущей тренировки будут потеряны. Вы уверены?')) {
          setCurrentWorkout(null);
          setIsTimerRunning(false);
          setTimerSeconds(0);
          alert('Тренировка отменена');
        }
      };
      /* </CHANGE> */

      const checkAndUnlockAchievements = (lastWorkout, allWorkouts = workouts) => {
        const getWorkoutVolume = (w) => 
          w.exercises.reduce((s, e) => s + e.sets.reduce((a, st) => a + (st.weight || 0) * st.reps, 0), 0);
        
        const getTotalVolume = (ww) => 
          ww.reduce((t, w) => t + getWorkoutVolume(w), 0);

        const getTotalHours = (ww) => {
          const totalMs = ww.reduce((sum, w) => w.endDate ? sum + (new Date(w.endDate).getTime() - new Date(w.startDate).getTime()) : sum, 0);
          return totalMs / 3600000;
        };

        const lastVolume = lastWorkout ? getWorkoutVolume(lastWorkout) : 0;
        const totalVol = getTotalVolume(allWorkouts);
        const totalHours = getTotalHours(allWorkouts);

        const checks = [
          { id: 'c1', condition: allWorkouts.length >= 1 },
          { id: 'c10', condition: allWorkouts.length >= 10 },
          { id: 'c50', condition: allWorkouts.length >= 50 },
          { id: 'c100', condition: allWorkouts.length >= 100 },
          { id: 'c200', condition: allWorkouts.length >= 200 },
          { id: 'c400', condition: allWorkouts.length >= 400 },
          { id: 'c800', condition: allWorkouts.length >= 800 },
          { id: 'v1t', condition: lastVolume > 1000 },
          { id: 'v2t', condition: lastVolume > 2000 },
          { id: 'v5t', condition: lastVolume > 5000 },
          { id: 'v10t', condition: lastVolume > 10000 },
          { id: 'v20t', condition: lastVolume > 20000 },
          { id: 'v40t', condition: lastVolume > 40000 },
          { id: 't50t', condition: totalVol > 50000 },
          { id: 't100t', condition: totalVol > 100000 },
          { id: 't250t', condition: totalVol > 250000 },
          { id: 't500t', condition: totalVol > 500000 },
          { id: 't1000t', condition: totalVol > 1000000 },
          { id: 'time5h', condition: totalHours > 5 },
          { id: 'time20h', condition: totalHours > 20 },
          { id: 'time50h', condition: totalHours > 50 },
          { id: 'time100h', condition: totalHours > 100 },
          { id: 'time250h', condition: totalHours > 250 },
          { id: 'time500h', condition: totalHours > 500 }
        ];

        const newly = [];
        checks.forEach(check => {
          if (!unlockedAchievements.includes(check.id) && check.condition) {
            newly.push(check.id);
          }
        });

        if (newly.length > 0) {
          const updatedAchievements = [...unlockedAchievements, ...newly];
          setUnlockedAchievements(updatedAchievements);
          localStorage.setItem('gym_achievements', JSON.stringify(updatedAchievements));
          const achievementNames = newly.map(id => {
            for (const cat of ACHIEVEMENT_CATEGORIES) {
              const ach = cat.achievements.find(a => a.id === id);
              if (ach) return ach.title;
            }
            return '';
          }).filter(Boolean);
          
          setTimeout(() => {
            alert(`🎉 Новое достижение разблокировано!\n\n${achievementNames.join(', ')}`);
          }, 500);
        }
      };

      const finishWorkout = () => {
        if (!currentWorkout) return;
        
        const filtered = currentWorkout.exercises.filter(e => e.sets.length > 0);
        if (filtered.length === 0) {
          alert('Добавьте хотя бы один подход');
          return;
        }

        /* Изменено: теперь только 3 варианта оценки самочувствия */
        const mood = prompt('Оцените общее самочувствие после тренировки:\n1 - Плохо 😫\n2 - Нормально 😐\n3 - Отлично 😄', '2');
        const overallMood = mood ? Math.min(3, Math.max(1, parseInt(mood) || 2)) : 2;
        /* </CHANGE> */

        const notes = prompt('Добавьте заметки о тренировке (ощущения, боли, идеи):', '');

        const finished = {
          ...currentWorkout,
          exercises: filtered,
          endDate: new Date().toISOString(),
          overallMood,
          notes: notes || ''
        };

        const updated = [...workouts, finished];
        setWorkouts(updated);
        
        setIsTimerRunning(false);
        setTimerSeconds(0);
        
        setCurrentWorkout(null);
        
        checkAndUnlockAchievements(finished, updated);
        
        alert('Тренировка завершена! 💪');
      };

      const exportData = () => {
        const data = {
          exercises: exercises.filter(e => !e.system),
          workouts,
          templates,
          goals,
          userSettings,
          exportDate: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gym-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('Данные экспортированы! 📥');
      };

      /* Добавлена функция импорта данных */
      const importData = () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const data = JSON.parse(event.target.result);
              
              if (!data.workouts || !Array.isArray(data.workouts)) {
                alert('❌ Неверный формат файла');
                return;
              }
              
              const confirmMsg = `Импортировать данные?\n\n` +
                `Тренировок: ${data.workouts?.length || 0}\n` +
                `Шаблонов: ${data.templates?.length || 0}\n` +
                `Упражнений: ${data.exercises?.length || 0}\n` +
                `Целей: ${data.goals?.length || 0}\n\n` +
                `⚠️ Это добавит данные к существующим!`;
              
              if (!confirm(confirmMsg)) return;
              
              // Импорт тренировок
              if (data.workouts && Array.isArray(data.workouts)) {
                setWorkouts([...workouts, ...data.workouts]);
              }
              
              // Импорт шаблонов
              if (data.templates && Array.isArray(data.templates)) {
                setTemplates([...templates, ...data.templates]);
              }
              
              // Импорт упражнений
              if (data.exercises && Array.isArray(data.exercises)) {
                const userExercises = data.exercises.filter(e => !e.system);
                let maxId = Math.max(...exercises.map(e => e.id), 0);
                const newExercises = userExercises.map(e => ({
                  ...e,
                  id: ++maxId,
                  system: false
                }));
                setExercises([...exercises, ...newExercises]);
              }
              
              // Импорт целей
              if (data.goals && Array.isArray(data.goals)) {
                setGoals([...goals, ...data.goals]);
              }

              // Импорт настроек
              if (data.userSettings) {
                setUserSettings(data.userSettings);
                localStorage.setItem('gym_settings', JSON.stringify(data.userSettings));
              }
              
              alert('✅ Данные успешно импортированы!');
            } catch (error) {
              alert('❌ Ошибка при чтении файла: ' + error.message);
            }
          };
          
          reader.readAsText(file);
        };
        
        input.click();
      };
      /* </CHANGE> */

      const resetAllData = () => {
        if (!confirm('⚠️ Внимание!\n\nЭто удалит все данные. Вы уверены?')) return;
        
        if (confirm('Хотите сначала экспортировать данные?')) {
          exportData();
          setTimeout(() => {
            if (confirm('Теперь удалить все данные? Это действие необратимо!')) {
              localStorage.clear();
              window.location.reload();
            }
          }, 1000);
        } else {
          if (confirm('Последнее предупреждение! Все данные будут удалены безвозвратно. Продолжить?')) {
            localStorage.clear();
            window.location.reload();
          }
        }
      };

      return (
        <div>
          <header className="header">
            <div className="header-content">
              <div className="logo">
                <div className="logo-icon">💪</div>
                <div className="logo-text">
                  <h1>GymFlow</h1>
                  <p>Трекер прогресса</p>
                </div>
              </div>
              
              <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap'}}>
                {restTimer.isRunning && restTimer.remainingSeconds > 0 && (
                  <div 
                    className="timer-display" 
                    style={{
                      background: 'linear-gradient(135deg, #fef3c7 0%, #fde68a 100%)', 
                      borderColor: '#f59e0b',
                      cursor: 'pointer'
                    }}
                    onClick={() => setActiveTab('workout')}
                    title="Отдых между подходами. Нажмите, чтобы открыть тренировку"
                  >
                    <span className="timer-icon">⏳</span>
                    <span className="timer-text" style={{color: '#b45309'}}>
                      {Math.floor(restTimer.remainingSeconds / 60)}:{(restTimer.remainingSeconds % 60).toString().padStart(2, '0')}
                    </span>
                  </div>
                )}
                {isTimerRunning && (
                  <div className="timer-display">
                    <span className="timer-icon">⏱️</span>
                    <span className="timer-text">{formatTime(timerSeconds)}</span>
                  </div>
                )}
              </div>
            </div>
          </header>

          <div className="container">
            <nav className="nav">
              <div className="nav-buttons">
                <button className={`nav-btn ${activeTab === 'workout' ? 'active' : ''}`} onClick={() => setActiveTab('workout')}>
                  <span>💪</span> Тренировка
                </button>
                <button className={`nav-btn ${activeTab === 'templates' ? 'active' : ''}`} onClick={() => setActiveTab('templates')}>
                  <span>📅</span> Шаблоны
                </button>
                <button className={`nav-btn ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}>
                  <span>📈</span> История
                </button>
                <button className={`nav-btn ${activeTab === 'stats' ? 'active' : ''}`} onClick={() => setActiveTab('stats')}>
                  <span>📊</span> Статистика
                </button>
                <button className={`nav-btn ${activeTab === 'goals' ? 'active' : ''}`} onClick={() => setActiveTab('goals')}>
                  <span>🎯</span> Цели
                </button>
                <button className={`nav-btn ${activeTab === 'calendar' ? 'active' : ''}`} onClick={() => setActiveTab('calendar')}>
                  <span>📆</span> Посещения
                </button>
                <button className={`nav-btn ${activeTab === 'achievements' ? 'active' : ''}`} onClick={() => setActiveTab('achievements')}>
                  <span>🏆</span> Достижения
                </button>
                <button className={`nav-btn ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}>
                  <span>⚙️</span> Настройки
                </button>
              </div>
            </nav>

            <main>
              {activeTab === 'workout' && (
                <WorkoutTab
                  currentWorkout={currentWorkout}
                  exercises={exercises}
                  templates={templates}
                  workouts={workouts}
                  userSettings={userSettings}
                  restTimer={restTimer}
                  onStartRestTimer={startRestTimer}
                  onStopRestTimer={stopRestTimer}
                  onAdjustRestTimer={adjustRestTimer}
                  onStartWorkout={startNewWorkout}
                  onFinishWorkout={finishWorkout}
                  onCancelWorkout={cancelWorkout}
                  onUpdateWorkout={setCurrentWorkout}
                />
              )}
              
              {activeTab === 'templates' && (
                <TemplatesTab
                  templates={templates}
                  exercises={exercises}
                  onSaveTemplate={(template) => {
                    if (template.id && templates.find(t => t.id === template.id)) {
                      setTemplates(templates.map(t => t.id === template.id ? template : t));
                    } else {
                      setTemplates([...templates, { ...template, id: Date.now(), createdAt: new Date().toISOString() }]);
                    }
                  }}
                  onDeleteTemplate={(id) => setTemplates(templates.filter(t => t.id !== id))}
                  onStartFromTemplate={startFromTemplate}
                />
              )}
              
              {activeTab === 'history' && (
                <HistoryTab workouts={workouts} exercises={exercises} />
              )}
              
              {activeTab === 'stats' && (
                <StatsTab workouts={workouts} exercises={exercises} />
              )}
              
              {activeTab === 'goals' && (
                <GoalsTab 
                  goals={goals}
                  onSaveGoal={(goal) => {
                    if (goal.id && goals.find(g => g.id === goal.id)) {
                      setGoals(goals.map(g => g.id === goal.id ? goal : g));
                    } else {
                      setGoals([...goals, { ...goal, id: Date.now(), createdAt: new Date().toISOString() }]);
                    }
                  }}
                  onDeleteGoal={(id) => setGoals(goals.filter(g => g.id !== id))}
                />
              )}
              
              {activeTab === 'calendar' && (
                <CalendarTab workouts={workouts} />
              )}
              
              {activeTab === 'achievements' && (
                <AchievementsTab unlockedAchievements={unlockedAchievements} />
              )}
              
              {activeTab === 'settings' && (
                <SettingsTab
                  exercises={exercises}
                  userSettings={userSettings}
                  onSaveUserSettings={(newSettings) => {
                    setUserSettings(newSettings);
                    localStorage.setItem('gym_settings', JSON.stringify(newSettings));
                    alert('Настройки сохранены! ✅');
                  }}
                  onAddExercise={(name, group, hasWeight) => {
                    const id = Date.now();
                    const newEx = {
                      id,
                      name,
                      group: group || 'Пользовательские',
                      hasWeight: hasWeight !== undefined ? hasWeight : true,
                      system: false
                    };
                    const updated = [...exercises, newEx];
                    setExercises(updated);
                    localStorage.setItem('gym_exercises', JSON.stringify(updated.filter(e => !e.system)));
                  }}
                  onDeleteExercise={(id) => {
                    const ex = exercises.find(e => e.id === id);
                    if (ex?.system) {
                      alert('Системные упражнения удалять нельзя');
                      return;
                    }
                    const used = templates.some(t => t.exercises.some(e => e.exerciseId === id));
                    if (used) {
                      alert('Нельзя удалить упражнение, используемое в шаблонах');
                      return;
                    }
                    if (confirm(`Удалить «${ex?.name}»?`)) {
                      const updated = exercises.filter(e => e.id !== id);
                      setExercises(updated);
                      localStorage.setItem('gym_exercises', JSON.stringify(updated.filter(e => !e.system)));
                    }
                  }}
                  onExportData={exportData}
                  onImportData={importData}
                  onResetData={resetAllData}
                />
              )}
            </main>
          </div>
        </div>
      );
    }


    function WorkoutTab({ currentWorkout, exercises, templates, workouts, userSettings, restTimer, onStartRestTimer, onStopRestTimer, onAdjustRestTimer, onStartWorkout, onFinishWorkout, onCancelWorkout, onUpdateWorkout }) {
      const [showExerciseModal, setShowExerciseModal] = useState(false);
      const [showSetModal, setShowSetModal] = useState(false);
      const [showBodyWeightModal, setShowBodyWeightModal] = useState(false);
      const [bodyWeightType, setBodyWeightType] = useState('before');
      const [selectedExerciseId, setSelectedExerciseId] = useState(null);
      const [weightStr, setWeightStr] = useState('50');
      const [repsStr, setRepsStr] = useState('10');
      const [mood, setMood] = useState(2);
      const [bodyWeightStr, setBodyWeightStr] = useState('70');
      const [showRestTimerModal, setShowRestTimerModal] = useState(false);
      const [restTimerMinutes, setRestTimerMinutes] = useState(1);
      const [restTimerSeconds, setRestTimerSeconds] = useState(30);
      const [exerciseSearchQuery, setExerciseSearchQuery] = useState('');

      // Поиск прошлых подходов упражнения из завершенных тренировок
      const getPreviousExerciseStats = (exerciseId, exerciseName) => {
        if (!workouts || workouts.length === 0) return null;
        for (let i = workouts.length - 1; i >= 0; i--) {
          const w = workouts[i];
          const match = w.exercises?.find(e => 
            (e.exerciseId === exerciseId || (exerciseName && e.exerciseName && e.exerciseName.toLowerCase() === exerciseName.toLowerCase())) &&
            e.sets && e.sets.length > 0
          );
          if (match) {
            return {
              date: w.startDate,
              sets: match.sets
            };
          }
        }
        return null;
      };

      const addExerciseToWorkout = (exerciseId) => {
        if (!currentWorkout) return;
        
        const exercise = exercises.find(e => e.id === exerciseId);
        if (!exercise) return;

        const exists = currentWorkout.exercises.find(e => e.exerciseId === exerciseId);
        if (exists) {
          alert('Упражнение уже добавлено в текущую тренировку');
          return;
        }

        const templateExercise = templates
          .flatMap(t => t.exercises)
          .find(e => e.exerciseId === exerciseId);
        const defaultRestTime = templateExercise?.restTime || userSettings?.defaultRestTime || 90;

        onUpdateWorkout({
          ...currentWorkout,
          exercises: [...currentWorkout.exercises, {
            exerciseId: exercise.id,
            exerciseName: exercise.name,
            hasWeight: checkExerciseHasWeight(exercise),
            sets: [],
            restTime: defaultRestTime
          }]
        });
        setShowExerciseModal(false);
        setExerciseSearchQuery('');
      };

      const openSetModal = (exerciseId) => {
        setSelectedExerciseId(exerciseId);
        const exercise = currentWorkout?.exercises.find(e => e.exerciseId === exerciseId);
        const exDef = exercises.find(e => e.id === exerciseId);
        const hasWeight = exDef ? checkExerciseHasWeight(exDef) : checkExerciseHasWeight(exercise);
        
        if (exercise && exercise.sets.length > 0) {
          const lastSet = exercise.sets[exercise.sets.length - 1];
          setWeightStr(String(lastSet.weight || 0));
          setRepsStr(String(lastSet.reps || 10));
          setMood(lastSet.mood || 2);
        } else {
          // Проверяем прошлую тренировку
          const prev = getPreviousExerciseStats(exerciseId, exercise?.exerciseName);
          if (prev && prev.sets.length > 0) {
            const firstSet = prev.sets[0];
            setWeightStr(String(firstSet.weight || 0));
            setRepsStr(String(firstSet.reps || 10));
            setMood(firstSet.mood || 2);
          } else {
            setWeightStr(String(hasWeight ? (userSettings?.defaultWeight || 50) : 0));
            setRepsStr(String(userSettings?.defaultReps || 10));
            setMood(2);
          }
        }
        setShowSetModal(true);
      };

      const handleWeightChange = (e) => {
        const val = e.target.value.replace(',', '.');
        if (val === '' || /^\d*\.?\d*$/.test(val)) {
          setWeightStr(val);
        }
      };

      const handleRepsChange = (e) => {
        const val = e.target.value;
        if (val === '' || /^\d*$/.test(val)) {
          setRepsStr(val);
        }
      };

      const stepWeight = (delta) => {
        const current = parseFloat(weightStr.replace(',', '.')) || 0;
        const updated = Math.max(0, Math.round((current + delta) * 10) / 10);
        setWeightStr(String(updated));
      };

      const stepReps = (delta) => {
        const current = parseInt(repsStr, 10) || 0;
        const updated = Math.max(0, current + delta);
        setRepsStr(String(updated));
      };

      const addSet = () => {
        if (!currentWorkout || selectedExerciseId === null) return;
        const ex = currentWorkout.exercises.find(e => e.exerciseId === selectedExerciseId);
        const exDef = exercises.find(e => e.id === selectedExerciseId);
        const hasWeight = exDef ? checkExerciseHasWeight(exDef) : checkExerciseHasWeight(ex);

        const parsedReps = parseInt(repsStr, 10);
        if (!parsedReps || parsedReps <= 0) {
          alert('Укажите количество повторений больше 0');
          return;
        }

        const parsedWeight = hasWeight ? (parseFloat(weightStr.replace(',', '.')) || 0) : 0;

        const newSet = {
          weight: parsedWeight,
          reps: parsedReps,
          mood: mood || 2,
          timestamp: Date.now()
        };

        const updated = {
          ...currentWorkout,
          exercises: currentWorkout.exercises.map(item =>
            item.exerciseId === selectedExerciseId
              ? { ...item, sets: [...item.sets, newSet] }
              : item
          )
        };
        onUpdateWorkout(updated);
        setShowSetModal(false);

        // Автоматический запуск таймера отдыха между подходами
        const restDuration = ex?.restTime || userSettings?.defaultRestTime || 90;
        onStartRestTimer(restDuration, ex?.exerciseName || '');
      };

      const addSetSameAsPrevious = () => {
        if (!currentWorkout || selectedExerciseId === null) return;
        const ex = currentWorkout.exercises.find(e => e.exerciseId === selectedExerciseId);
        if (!ex || ex.sets.length === 0) {
          alert('Нет предыдущих подходов');
          return;
        }
        const lastSet = ex.sets[ex.sets.length - 1];
        const updated = {
          ...currentWorkout,
          exercises: currentWorkout.exercises.map(e =>
            e.exerciseId === selectedExerciseId
              ? { ...e, sets: [...e.sets, { ...lastSet, timestamp: Date.now() }] }
              : e
          )
        };
        onUpdateWorkout(updated);
        setShowSetModal(false);

        // Автоматический запуск таймера отдыха между подходами
        const restDuration = ex.restTime || userSettings?.defaultRestTime || 90;
        onStartRestTimer(restDuration, ex.exerciseName || '');
      };

      const deleteSet = (exerciseId, setIndex) => {
        if (!confirm('Удалить подход?')) return;
        if (!currentWorkout) return;
        
        const updated = {
          ...currentWorkout,
          exercises: currentWorkout.exercises.map(ex =>
            ex.exerciseId === exerciseId
              ? { ...ex, sets: ex.sets.filter((_, i) => i !== setIndex) }
              : ex
          )
        };
        onUpdateWorkout(updated);
      };

      const openBodyWeightModal = (type) => {
        setBodyWeightType(type);
        const current = type === 'before' ? currentWorkout?.bodyWeightBefore : currentWorkout?.bodyWeightAfter;
        setBodyWeightStr(current ? String(current) : '70');
        setShowBodyWeightModal(true);
      };

      const saveBodyWeight = () => {
        if (!currentWorkout) return;
        const num = parseFloat(bodyWeightStr.replace(',', '.')) || 0;
        if (bodyWeightType === 'before') {
          onUpdateWorkout({ ...currentWorkout, bodyWeightBefore: num });
        } else {
          onUpdateWorkout({ ...currentWorkout, bodyWeightAfter: num });
        }
        setShowBodyWeightModal(false);
      };

      const openRestTimerModal = (exerciseId) => {
        setSelectedExerciseId(exerciseId);
        const exercise = currentWorkout?.exercises.find(e => e.exerciseId === exerciseId);
        const currentRest = exercise?.restTime || userSettings?.defaultRestTime || 90;
        setRestTimerMinutes(Math.floor(currentRest / 60));
        setRestTimerSeconds(currentRest % 60);
        setShowRestTimerModal(true);
      };

      const saveRestTimer = () => {
        if (!currentWorkout || selectedExerciseId === null) return;
        const totalSeconds = restTimerMinutes * 60 + restTimerSeconds;
        const updated = {
          ...currentWorkout,
          exercises: currentWorkout.exercises.map(ex =>
            ex.exerciseId === selectedExerciseId
              ? { ...ex, restTime: totalSeconds }
              : ex
          )
        };
        onUpdateWorkout(updated);
        setShowRestTimerModal(false);
      };

      const getMoodEmoji = (m) => m === 1 ? '😫' : m === 3 ? '😄' : '😐';

      if (!currentWorkout) {
        return (
          <div className="card empty-state">
            <div className="empty-icon">💪</div>
            <h2 className="empty-title">Начните тренировку</h2>
            <p style={{marginBottom: '2rem'}}>Создайте новую тренировку или выберите готовый шаблон</p>
            <button onClick={onStartWorkout} className="btn btn-primary btn-large">
              Начать тренировку
            </button>
          </div>
        );
      }

      return (
        <div>
          {/* Баннер таймера отдыха между подходами */}
          {restTimer.isRunning && restTimer.remainingSeconds > 0 && (
            <div className="card" style={{background: 'linear-gradient(135deg, #fef3c7 0%, #fde68a 100%)', border: '2px solid #fbbf24', marginBottom: '1rem'}}>
              <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0.75rem'}}>
                <div style={{display: 'flex', alignItems: 'center', gap: '0.75rem'}}>
                  <span style={{fontSize: '28px'}}>⏱️</span>
                  <div>
                    <h3 style={{fontWeight: 600, color: '#0f172a', marginBottom: '0.25rem'}}>
                      Отдых {restTimer.exerciseName ? `(${restTimer.exerciseName})` : ''}
                    </h3>
                    <p style={{fontSize: '2rem', fontWeight: 700, color: '#b45309', fontFamily: 'Courier New, monospace'}}>
                      {Math.floor(restTimer.remainingSeconds / 60)}:{(restTimer.remainingSeconds % 60).toString().padStart(2, '0')}
                    </p>
                  </div>
                </div>
                <div style={{display: 'flex', gap: '0.5rem', alignItems: 'center', flexWrap: 'wrap'}}>
                  <button onClick={() => onAdjustRestTimer(-30)} className="btn btn-secondary" style={{padding: '0.5rem 0.75rem', fontSize: '0.875rem'}}>
                    -30с
                  </button>
                  <button onClick={() => onAdjustRestTimer(30)} className="btn btn-secondary" style={{padding: '0.5rem 0.75rem', fontSize: '0.875rem'}}>
                    +30с
                  </button>
                  <button onClick={onStopRestTimer} className="btn btn-secondary" style={{color: '#dc2626', fontSize: '0.875rem'}}>
                    Остановить
                  </button>
                </div>
              </div>
            </div>
          )}
          
          <div className="card" style={{background: 'linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%)', border: '1px solid #93c5fd'}}>
            <div style={{display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '1rem'}}>
              <span style={{fontSize: '20px'}}>⚖️</span>
              <h3 style={{fontWeight: 600, color: '#0f172a'}}>Вес тела</h3>
            </div>
            <div className="grid" style={{gridTemplateColumns: 'repeat(2, 1fr)'}}>
              <div style={{background: 'white', borderRadius: '12px', padding: '1rem'}}>
                <p style={{fontSize: '0.875rem', color: '#64748b', marginBottom: '0.5rem'}}>До тренировки</p>
                {currentWorkout.bodyWeightBefore ? (
                  <p style={{fontSize: '1.5rem', fontWeight: 700, color: '#0f172a'}}>{currentWorkout.bodyWeightBefore.toFixed(1)} кг</p>
                ) : (
                  <button onClick={() => openBodyWeightModal('before')} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                    Указать вес
                  </button>
                )}
              </div>
              <div style={{background: 'white', borderRadius: '12px', padding: '1rem'}}>
                <p style={{fontSize: '0.875rem', color: '#64748b', marginBottom: '0.5rem'}}>После тренировки</p>
                {currentWorkout.bodyWeightAfter ? (
                  <p style={{fontSize: '1.5rem', fontWeight: 700, color: '#0f172a'}}>{currentWorkout.bodyWeightAfter.toFixed(1)} кг</p>
                ) : (
                  <button onClick={() => openBodyWeightModal('after')} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                    Указать вес
                  </button>
                )}
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-header">
              <h3 style={{fontSize: '1.25rem', fontWeight: 700}}>Упражнения</h3>
              <button onClick={() => setShowExerciseModal(true)} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                <span>➕</span> Добавить
              </button>
            </div>

            {currentWorkout.exercises.length === 0 ? (
              <div className="empty-state" style={{padding: '2rem 0'}}>
                <div className="empty-icon" style={{fontSize: '3rem'}}>🏋️</div>
                <h3 className="empty-title">Добавьте упражнения</h3>
                <p style={{marginBottom: '1.5rem'}}>Начните тренировку с выбора упражнений</p>
                <button onClick={() => setShowExerciseModal(true)} className="btn btn-primary btn-large">
                  <span>➕</span> Добавить упражнение
                </button>
              </div>
            ) : (
              <>
                <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                  {currentWorkout.exercises.map(ex => {
                    const exDef = exercises.find(e => e.id === ex.exerciseId);
                    const hasWeight = exDef ? checkExerciseHasWeight(exDef) : checkExerciseHasWeight(ex);
                    const prevStats = getPreviousExerciseStats(ex.exerciseId, ex.exerciseName);

                    return (
                      <div key={ex.exerciseId} className="exercise-item">
                        <div style={{marginBottom: '0.5rem'}}>
                          <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '0.5rem'}}>
                            <h4 style={{fontWeight: 600, color: '#0f172a', fontSize: '1.05rem'}}>{ex.exerciseName}</h4>
                            <span style={{fontSize: '0.75rem', color: hasWeight ? '#2563eb' : '#059669', background: hasWeight ? '#eff6ff' : '#ecfdf5', padding: '0.2rem 0.5rem', borderRadius: '4px', fontWeight: 500}}>
                              {hasWeight ? 'С весом' : 'Без веса'}
                            </span>
                          </div>
                          <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap', marginTop: '0.25rem'}}>
                            <p style={{fontSize: '0.875rem', color: '#64748b'}}>Подходов: {ex.sets.length}</p>
                            {ex.restTime && (
                              <>
                                <span style={{color: '#94a3b8'}}>•</span>
                                <p style={{fontSize: '0.875rem', color: '#64748b'}}>
                                  Отдых: {Math.floor(ex.restTime / 60)}:{(ex.restTime % 60).toString().padStart(2, '0')}
                                </p>
                              </>
                            )}
                          </div>

                          {/* Отображение веса и повторений из прошлой тренировки */}
                          {prevStats && (
                            <div style={{background: '#eff6ff', borderRadius: '8px', padding: '0.5rem 0.75rem', margin: '0.5rem 0', border: '1px solid #bfdbfe'}}>
                              <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '0.25rem'}}>
                                <span style={{fontSize: '0.75rem', fontWeight: 600, color: '#1e40af'}}>
                                  ⏮️ В прошлый раз ({new Date(prevStats.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}):
                                </span>
                              </div>
                              <div style={{display: 'flex', flexWrap: 'wrap', gap: '0.375rem', fontSize: '0.8125rem', color: '#1e3a8a'}}>
                                {prevStats.sets.map((s, sIdx) => (
                                  <span key={sIdx} style={{background: '#dbeafe', padding: '0.125rem 0.5rem', borderRadius: '4px', fontWeight: 500}}>
                                    {hasWeight && s.weight > 0 ? `${s.weight} кг × ${s.reps}` : `${s.reps} повт.`}
                                  </span>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>

                        {ex.sets.length > 0 && (
                          <div style={{background: '#f8fafc', borderRadius: '8px', padding: '0.75rem', marginBottom: '0.75rem'}}>
                            {ex.sets.map((set, idx) => (
                              <div key={idx} style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: idx < ex.sets.length - 1 ? '0.5rem' : 0}}>
                                <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                                  <span style={{fontWeight: 500, color: '#475569'}}>
                                    {idx + 1}. {hasWeight && set.weight > 0 ? `${set.weight} кг × ${set.reps} повт.` : `${set.reps} повт.`}
                                  </span>
                                  <span>{getMoodEmoji(set.mood)}</span>
                                </div>
                                <button onClick={() => deleteSet(ex.exerciseId, idx)} style={{background: 'none', border: 'none', color: '#ef4444', cursor: 'pointer', fontSize: '1rem'}}>
                                  🗑️
                                </button>
                              </div>
                            ))}
                          </div>
                        )}

                        <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
                          <button onClick={() => openSetModal(ex.exerciseId)} className="btn btn-secondary" style={{fontSize: '0.875rem', flex: 1, justifyContent: 'center'}}>
                            <span>➕</span> Подход
                          </button>
                          <button onClick={() => openRestTimerModal(ex.exerciseId)} className="btn btn-secondary" style={{fontSize: '0.875rem'}} title="Таймер отдыха">
                            ⏱️
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Кнопка добавления упражнения внизу списка, чтобы не нужно было листать наверх */}
                <div style={{marginTop: '1.25rem', paddingTop: '1rem', borderTop: '1px solid #e2e8f0'}}>
                  <button 
                    onClick={() => setShowExerciseModal(true)} 
                    className="btn btn-primary btn-large" 
                    style={{width: '100%', justifyContent: 'center', boxShadow: '0 4px 14px rgba(37, 99, 235, 0.25)'}}
                  >
                    <span>➕</span> Добавить упражнение
                  </button>
                </div>
              </>
            )}
          </div>

          <div className="card">
            <h3 style={{fontSize: '1.125rem', fontWeight: 600, color: '#0f172a', marginBottom: '1rem'}}>Быстрый таймер отдыха</h3>
            <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
              <button onClick={() => onStartRestTimer(30, 'Быстрый таймер')} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                30 сек
              </button>
              <button onClick={() => onStartRestTimer(60, 'Быстрый таймер')} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                1 мин
              </button>
              <button onClick={() => onStartRestTimer(90, 'Быстрый таймер')} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                1.5 мин
              </button>
              <button onClick={() => onStartRestTimer(120, 'Быстрый таймер')} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                2 мин
              </button>
              <button onClick={() => onStartRestTimer(180, 'Быстрый таймер')} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                3 мин
              </button>
            </div>
          </div>

          <div className="card">
            <div style={{display: 'flex', gap: '0.75rem', flexDirection: 'column'}}>
              <button onClick={onFinishWorkout} className="btn btn-success btn-large" style={{width: '100%', justifyContent: 'center'}}>
                <span>✅</span> Завершить тренировку
              </button>
              <button onClick={onCancelWorkout} className="btn btn-warning btn-large" style={{width: '100%', justifyContent: 'center'}}>
                <span>❌</span> Отменить тренировку
              </button>
            </div>
          </div>

          {/* Модальное окно выбора упражнения с мгновенным поиском */}
          {showExerciseModal && (
            <Modal onClose={() => { setShowExerciseModal(false); setExerciseSearchQuery(''); }} title="Добавить упражнение">
              <div style={{display: 'flex', flexDirection: 'column', gap: '1rem', maxHeight: '70vh'}}>
                <input
                  type="text"
                  placeholder="🔍 Поиск (например: становая тяга, приседания)..."
                  value={exerciseSearchQuery}
                  onChange={e => setExerciseSearchQuery(e.target.value)}
                  className="input"
                  autoFocus
                />
                <div style={{overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '0.5rem'}}>
                  {(() => {
                    const q = exerciseSearchQuery.trim().toLowerCase();
                    const filtered = q 
                      ? exercises.filter(e => e.name.toLowerCase().includes(q) || (e.group && e.group.toLowerCase().includes(q)))
                      : exercises;

                    if (filtered.length === 0) {
                      return (
                        <p style={{padding: '1.5rem 1rem', textAlign: 'center', color: '#64748b'}}>
                          Упражнение не найдено. Вы можете создать его в разделе «Настройки».
                        </p>
                      );
                    }

                    const grouped = {};
                    filtered.forEach(ex => {
                      const group = ex.group || 'Пользовательские';
                      if (!grouped[group]) grouped[group] = [];
                      grouped[group].push(ex);
                    });

                    return Object.entries(grouped).map(([group, exList]) => (
                      <div key={group}>
                        <h4 style={{fontWeight: 600, color: '#475569', marginBottom: '0.5rem', marginTop: '0.75rem', textTransform: 'uppercase', fontSize: '0.8125rem'}}>
                          {group}
                        </h4>
                        {exList.map(exercise => {
                          const isNoWeight = !checkExerciseHasWeight(exercise);
                          return (
                            <button
                              key={exercise.id}
                              onClick={() => addExerciseToWorkout(exercise.id)}
                              className="btn btn-secondary"
                              style={{width: '100%', marginBottom: '0.5rem', justifyContent: 'space-between', textAlign: 'left'}}
                            >
                              <span style={{fontWeight: 500}}>{exercise.name}</span>
                              <span style={{fontSize: '0.75rem', color: isNoWeight ? '#059669' : '#2563eb', background: isNoWeight ? '#ecfdf5' : '#eff6ff', padding: '0.2rem 0.5rem', borderRadius: '4px', fontWeight: 500}}>
                                {isNoWeight ? 'Без веса' : 'С весом'}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    ));
                  })()}
                </div>
              </div>
            </Modal>
          )}

          {/* Модальное окно добавления подхода */}
          {showSetModal && selectedExerciseId !== null && (() => {
            const ex = currentWorkout?.exercises.find(e => e.exerciseId === selectedExerciseId);
            const exDef = exercises.find(e => e.id === selectedExerciseId);
            const hasWeight = exDef ? checkExerciseHasWeight(exDef) : checkExerciseHasWeight(ex);
            const prevStats = getPreviousExerciseStats(selectedExerciseId, ex?.exerciseName);

            return (
              <Modal onClose={() => setShowSetModal(false)} title={`Подход: ${ex?.exerciseName || ''}`}>
                <div style={{display: 'flex', flexDirection: 'column', gap: '1.25rem'}}>
                  
                  {/* Прошлый результат тренировки для подсказки */}
                  {prevStats && (
                    <div style={{background: '#eff6ff', borderRadius: '10px', padding: '0.75rem', border: '1px solid #bfdbfe'}}>
                      <p style={{fontSize: '0.8125rem', fontWeight: 600, color: '#1e40af', marginBottom: '0.375rem'}}>
                        ⏮️ В прошлый раз ({new Date(prevStats.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}):
                      </p>
                      <div style={{display: 'flex', flexWrap: 'wrap', gap: '0.375rem', marginBottom: '0.375rem'}}>
                        {prevStats.sets.map((s, sIdx) => (
                          <button
                            key={sIdx}
                            type="button"
                            onClick={() => {
                              if (hasWeight) setWeightStr(String(s.weight || 0));
                              setRepsStr(String(s.reps || 10));
                              if (s.mood) setMood(s.mood);
                            }}
                            className="btn btn-secondary"
                            style={{fontSize: '0.75rem', padding: '0.25rem 0.5rem', background: '#dbeafe', border: '1px solid #93c5fd', color: '#1e40af'}}
                            title="Нажмите, чтобы скопировать вес и повторения"
                          >
                            {sIdx + 1}: {hasWeight && s.weight > 0 ? `${s.weight} кг × ${s.reps}` : `${s.reps} повт.`}
                          </button>
                        ))}
                      </div>
                      <p style={{fontSize: '0.6875rem', color: '#64748b'}}>💡 Нажмите на подход выше, чтобы подставить его значения</p>
                    </div>
                  )}

                  {/* Ввод веса - только для упражнений с весом */}
                  {hasWeight ? (
                    <div className="form-group" style={{marginBottom: 0}}>
                      <label className="label">Вес (кг) — можно вводить точку или запятую</label>
                      <div className="input-row">
                        <button 
                          onClick={() => stepWeight(-2.5)} 
                          className="counter-btn-large"
                          type="button"
                          aria-label="Уменьшить вес"
                        >
                          ▼
                        </button>
                        <input 
                          type="text" 
                          inputMode="decimal"
                          value={weightStr} 
                          onChange={handleWeightChange} 
                          className="counter-input"
                          style={{flex: 1, minWidth: 0}}
                          placeholder="0"
                        />
                        <button 
                          onClick={() => stepWeight(2.5)} 
                          className="counter-btn-large"
                          type="button"
                          aria-label="Увеличить вес"
                        >
                          ▲
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div style={{padding: '0.75rem 1rem', background: '#ecfdf5', borderRadius: '10px', border: '1px solid #a7f3d0', color: '#065f46', fontSize: '0.875rem', display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                      <span style={{fontSize: '1.25rem'}}>🤸</span>
                      <span>Упражнение с собственным весом (без отягощения)</span>
                    </div>
                  )}

                  {/* Ввод повторений */}
                  <div className="form-group" style={{marginBottom: 0}}>
                    <label className="label">Повторения</label>
                    <div className="input-row">
                      <button 
                        onClick={() => stepReps(-1)} 
                        className="counter-btn-large"
                        type="button"
                        aria-label="Уменьшить повторения"
                      >
                        ▼
                      </button>
                      <input 
                        type="text" 
                        inputMode="numeric"
                        value={repsStr} 
                        onChange={handleRepsChange} 
                        className="counter-input"
                        style={{flex: 1, minWidth: 0}}
                        placeholder="10"
                      />
                      <button 
                        onClick={() => stepReps(1)} 
                        className="counter-btn-large"
                        type="button"
                        aria-label="Увеличить повторения"
                      >
                        ▲
                      </button>
                    </div>
                  </div>

                  {/* Самочувствие */}
                  <div className="form-group" style={{marginBottom: 0}}>
                    <label className="label">Самочувствие</label>
                    <div style={{display: 'flex', gap: '0.5rem'}}>
                      {[1, 2, 3].map(m => (
                        <button
                          key={m}
                          onClick={() => setMood(m)}
                          type="button"
                          className="btn"
                          style={{
                            flex: 1,
                            background: mood === m ? '#2563eb' : '#f1f5f9',
                            color: mood === m ? 'white' : '#475569',
                            border: 'none',
                            fontSize: '2rem',
                            padding: '0.75rem'
                          }}
                        >
                          {m === 1 ? '😫' : m === 3 ? '😄' : '😐'}
                        </button>
                      ))}
                    </div>
                    <div style={{display: 'flex', justifyContent: 'space-between', marginTop: '0.25rem', fontSize: '0.75rem', color: '#64748b'}}>
                      <span>Тяжело</span>
                      <span>Нормально</span>
                      <span>Легко</span>
                    </div>
                  </div>

                  <div style={{display: 'flex', gap: '0.5rem', marginTop: '0.5rem'}}>
                    <button onClick={addSet} className="btn btn-primary" style={{flex: 1, justifyContent: 'center'}}>
                      Добавить подход
                    </button>
                    {ex && ex.sets.length > 0 && (
                      <button onClick={addSetSameAsPrevious} className="btn btn-secondary" style={{flex: 1, justifyContent: 'center'}}>
                        Как предыдущий
                      </button>
                    )}
                  </div>
                </div>
              </Modal>
            );
          })()}

          {/* Модальное окно веса тела */}
          {showBodyWeightModal && (
            <Modal onClose={() => setShowBodyWeightModal(false)} title={`Вес тела ${bodyWeightType === 'before' ? 'до' : 'после'} тренировки`}>
              <div style={{display: 'flex', flexDirection: 'column', gap: '1.5rem'}}>
                <div className="form-group">
                  <label className="label">Вес (кг) — можно вводить точку или запятую</label>
                  <input 
                    type="text" 
                    inputMode="decimal"
                    value={bodyWeightStr} 
                    onChange={e => {
                      const val = e.target.value.replace(',', '.');
                      if (val === '' || /^\d*\.?\d*$/.test(val)) setBodyWeightStr(val);
                    }} 
                    className="input" 
                    placeholder="70.0"
                  />
                </div>
                <button onClick={saveBodyWeight} className="btn btn-primary" style={{justifyContent: 'center'}}>
                  Сохранить
                </button>
              </div>
            </Modal>
          )}

          {/* Модальное окно таймера отдыха для упражнения */}
          {showRestTimerModal && selectedExerciseId !== null && (() => {
            const ex = currentWorkout?.exercises.find(e => e.exerciseId === selectedExerciseId);
            const currentDuration = ex?.restTime || userSettings?.defaultRestTime || 90;
            return (
              <Modal onClose={() => setShowRestTimerModal(false)} title={`Таймер отдыха: ${ex?.exerciseName || ''}`}>
                <div style={{display: 'flex', flexDirection: 'column', gap: '1.25rem'}}>
                  
                  {/* Кнопка мгновенного запуска таймера */}
                  <div style={{textAlign: 'center', background: '#f8fafc', padding: '1rem', borderRadius: '12px', border: '1px solid #e2e8f0'}}>
                    <p style={{fontSize: '0.875rem', color: '#64748b', marginBottom: '0.5rem'}}>
                      Установленное время отдыха для этого упражнения:
                    </p>
                    <p style={{fontSize: '2rem', fontWeight: 700, color: '#2563eb', fontFamily: 'Courier New, monospace', marginBottom: '1rem'}}>
                      {Math.floor(currentDuration / 60)}:{(currentDuration % 60).toString().padStart(2, '0')}
                    </p>
                    <button 
                      type="button"
                      onClick={() => {
                        onStartRestTimer(currentDuration, ex?.exerciseName);
                        setShowRestTimerModal(false);
                      }} 
                      className="btn btn-primary btn-large"
                      style={{width: '100%', justifyContent: 'center'}}
                    >
                      <span>▶️</span> Запустить отдых ({currentDuration} сек)
                    </button>
                  </div>

                  {/* Быстрый выбор другого времени */}
                  <div>
                    <label className="label">Быстрый запуск на другое время:</label>
                    <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '0.5rem'}}>
                      {[30, 45, 60, 90, 120, 180].map(sec => (
                        <button
                          key={sec}
                          type="button"
                          onClick={() => {
                            onStartRestTimer(sec, ex?.exerciseName);
                            setShowRestTimerModal(false);
                          }}
                          className="btn btn-secondary"
                          style={{justifyContent: 'center', fontSize: '0.875rem'}}
                        >
                          {sec < 60 ? `${sec} сек` : `${sec / 60} мин`}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Настройка времени по умолчанию для этого упражнения */}
                  <div style={{borderTop: '1px solid #e2e8f0', paddingTop: '1rem'}}>
                    <label className="label">Задать время по умолчанию для «{ex?.exerciseName}»:</label>
                    <div style={{display: 'flex', gap: '0.5rem', marginBottom: '0.75rem'}}>
                      <div style={{flex: 1}}>
                        <span style={{fontSize: '0.75rem', color: '#64748b'}}>Минуты</span>
                        <input 
                          type="number" 
                          min="0" 
                          max="30"
                          value={restTimerMinutes} 
                          onChange={e => setRestTimerMinutes(Math.max(0, parseInt(e.target.value) || 0))} 
                          className="input" 
                        />
                      </div>
                      <div style={{flex: 1}}>
                        <span style={{fontSize: '0.75rem', color: '#64748b'}}>Секунды</span>
                        <input 
                          type="number" 
                          min="0" 
                          max="59" 
                          value={restTimerSeconds} 
                          onChange={e => setRestTimerSeconds(Math.max(0, Math.min(59, parseInt(e.target.value) || 0)))} 
                          className="input" 
                        />
                      </div>
                    </div>
                    <button 
                      type="button"
                      onClick={saveRestTimer} 
                      className="btn btn-secondary" 
                      style={{width: '100%', justifyContent: 'center'}}
                    >
                      Сохранить время для упражнения
                    </button>
                  </div>

                </div>
              </Modal>
            );
          })()}
        </div>
      );
    }

    function TemplatesTab({ templates, exercises, onSaveTemplate, onDeleteTemplate, onStartFromTemplate }) {
      const [showModal, setShowModal] = useState(false);
      const [showViewModal, setShowViewModal] = useState(false);
      const [editingTemplate, setEditingTemplate] = useState(null);
      const [viewingTemplate, setViewingTemplate] = useState(null);
      const [templateName, setTemplateName] = useState('');
      const [selectedExercises, setSelectedExercises] = useState(new Set());
      const [searchQuery, setSearchQuery] = useState('');
      const [exerciseRestTimes, setExerciseRestTimes] = useState({});

      const openCreateModal = () => {
        setEditingTemplate(null);
        setTemplateName('');
        setSelectedExercises(new Set());
        setSearchQuery('');
        setExerciseRestTimes({});
        setShowModal(true);
      };

      const openEditModal = (template) => {
        setEditingTemplate(template);
        setTemplateName(template.name);
        setSelectedExercises(new Set(template.exercises.map(e => e.exerciseId)));
        setSearchQuery('');
        const restTimes = {};
        template.exercises.forEach(e => {
          if (e.restTime) {
            restTimes[e.exerciseId] = e.restTime;
          }
        });
        setExerciseRestTimes(restTimes);
        setShowModal(true);
      };

      const openViewModal = (template) => {
        setViewingTemplate(template);
        setShowViewModal(true);
      };

      const saveTemplate = () => {
        if (!templateName.trim()) {
          alert('Введите название тренировки');
          return;
        }
        if (selectedExercises.size === 0) {
          alert('Выберите хотя бы одно упражнение');
          return;
        }

        const template = {
          id: editingTemplate?.id || Date.now(),
          name: templateName,
          exercises: Array.from(selectedExercises).map(id => {
            const ex = exercises.find(e => e.id === id);
            return { 
              exerciseId: id, 
              exerciseName: ex.name,
              restTime: exerciseRestTimes[id] || null
            };
          }),
          createdAt: editingTemplate?.createdAt || new Date().toISOString()
        };

        onSaveTemplate(template);
        setShowModal(false);
        alert(`Шаблон «${templateName}» сохранён!`);
      };

      const setRestTimeForExercise = (exerciseId) => {
        const minutes = prompt('Минуты отдыха:', '1');
        const seconds = prompt('Секунды отдыха:', '30');
        if (minutes !== null && seconds !== null) {
          const totalSeconds = parseInt(minutes) * 60 + parseInt(seconds);
          setExerciseRestTimes({...exerciseRestTimes, [exerciseId]: totalSeconds});
        }
      };

      const filteredExercises = searchQuery
        ? exercises.filter(e => e.name.toLowerCase().includes(searchQuery.toLowerCase()))
        : exercises;

      const groupedExercises = {};
      filteredExercises.forEach(ex => {
        const group = ex.group || 'Прочие';
        if (!groupedExercises[group]) groupedExercises[group] = [];
        groupedExercises[group].push(ex);
      });

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2 className="card-title">Шаблоны тренировок</h2>
              <button onClick={openCreateModal} className="btn btn-primary">
                <span>➕</span> Создать шаблон
              </button>
            </div>

            {templates.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">📅</div>
                <h3 className="empty-title">Нет шаблонов</h3>
                <p>Создайте первый шаблон тренировки</p>
              </div>
            ) : (
              <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                {templates.map(template => (
                  <div key={template.id} className="exercise-item">
                    <div style={{display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: '0.75rem'}}>
                      <div style={{flex: 1}}>
                        <h3 style={{fontWeight: 600, fontSize: '1.125rem', color: '#0f172a', marginBottom: '0.25rem'}}>{template.name}</h3>
                        <p style={{fontSize: '0.875rem', color: '#64748b'}}>{template.exercises.length} упражнений</p>
                      </div>
                      <button onClick={() => { if (confirm('Удалить шаблон?')) { onDeleteTemplate(template.id); } }} style={{background: 'none', border: 'none', color: '#ef4444', cursor: 'pointer', fontSize: '1.25rem'}}>
                        🗑️
                      </button>
                    </div>
                    <p style={{fontSize: '0.875rem', color: '#64748b', marginBottom: '1rem'}}>
