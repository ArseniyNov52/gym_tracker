    function GoalsTab({ goals, onSaveGoal, onDeleteGoal }) {
      const [showModal, setShowModal] = useState(false);
      const [editingGoal, setEditingGoal] = useState(null);
      const [goalName, setGoalName] = useState('');
      const [goalTarget, setGoalTarget] = useState('');
      const [goalCurrent, setGoalCurrent] = useState('');
      const [goalUnit, setGoalUnit] = useState('');

      const openCreateModal = () => {
        setEditingGoal(null);
        setGoalName('');
        setGoalTarget('');
        setGoalCurrent('');
        setGoalUnit('');
        setShowModal(true);
      };

      const openEditModal = (goal) => {
        setEditingGoal(goal);
        setGoalName(goal.name);
        setGoalTarget(goal.target.toString());
        setGoalCurrent(goal.current.toString());
        setGoalUnit(goal.unit);
        setShowModal(true);
      };

      const saveGoal = () => {
        if (!goalName.trim()) {
          alert('Введите название цели');
          return;
        }
        const targetNum = parseFloat(goalTarget.replace(',', '.'));
        if (isNaN(targetNum) || targetNum <= 0) {
          alert('Введите числовую цель');
          return;
        }
        const currentNum = parseFloat(goalCurrent.replace(',', '.'));
        if (isNaN(currentNum)) {
          alert('Введите текущий результат');
          return;
        }

        const goal = {
          id: editingGoal?.id || Date.now(),
          name: goalName,
          target: targetNum,
          current: currentNum,
          unit: goalUnit || '',
          createdAt: editingGoal?.createdAt || new Date().toISOString()
        };

        onSaveGoal(goal);
        setShowModal(false);
        alert(editingGoal ? 'Цель обновлена!' : 'Цель создана!');
      };

      const updateGoalProgress = (goal) => {
        const newCurrent = prompt(`Обновить текущий результат для "${goal.name}":\n(Сейчас: ${goal.current} ${goal.unit})`, goal.current.toString());
        if (newCurrent !== null) {
          const parsed = parseFloat(newCurrent.replace(',', '.'));
          if (!isNaN(parsed)) {
            onSaveGoal({...goal, current: parsed});
          }
        }
      };

      const getProgressColor = (percentage) => {
        if (percentage >= 100) return '#10b981';
        if (percentage >= 75) return '#3b82f6';
        if (percentage >= 50) return '#f59e0b';
        return '#ef4444';
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2 className="card-title">Мои цели</h2>
              <button onClick={openCreateModal} className="btn btn-primary">
                <span>➕</span> Новая цель
              </button>
            </div>

            {goals.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">🎯</div>
                <h3 className="empty-title">Нет целей</h3>
                <p>Создайте свою первую цель и начните путь к успеху!</p>
              </div>
            ) : (
              <div style={{display: 'flex', flexDirection: 'column', gap: '1.5rem'}}>
                {goals.map(goal => {
                  const percentage = Math.min(100, (goal.current / goal.target) * 100);
                  const progressColor = getProgressColor(percentage);
                  const isCompleted = percentage >= 100;

                  return (
                    <div 
                      key={goal.id} 
                      style={{
                        background: isCompleted 
                          ? 'linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%)' 
                          : 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%)',
                        border: `2px solid ${isCompleted ? '#10b981' : '#e2e8f0'}`,
                        borderRadius: '16px',
                        padding: '1.5rem',
                        position: 'relative',
                        overflow: 'hidden'
                      }}
                    >
                      {isCompleted && (
                        <div style={{position: 'absolute', top: '10px', right: '10px', fontSize: '2rem'}}>
                          🎉
                        </div>
                      )}
                      
                      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '1rem'}}>
                        <div style={{flex: 1}}>
                          <h3 style={{fontSize: '1.5rem', fontWeight: 700, color: '#0f172a', marginBottom: '0.5rem'}}>
                            {goal.name}
                          </h3>
                          <p style={{fontSize: '1.125rem', color: '#64748b', fontWeight: 500}}>
                            {goal.current} / {goal.target} {goal.unit}
                          </p>
                        </div>
                        <button 
                          onClick={() => { if (confirm('Удалить цель?')) { onDeleteGoal(goal.id); } }} 
                          style={{background: 'none', border: 'none', color: '#ef4444', cursor: 'pointer', fontSize: '1.5rem'}}
                        >
                          🗑️
                        </button>
                      </div>

                      <div style={{position: 'relative', height: '32px', background: '#e2e8f0', borderRadius: '16px', overflow: 'hidden', marginBottom: '1rem'}}>
                        <div 
                          style={{
                            position: 'absolute',
                            top: 0,
                            left: 0,
                            height: '100%',
                            width: `${percentage}%`,
                            background: progressColor,
                            transition: 'width 0.5s ease',
                            borderRadius: '16px',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center'
                          }}
                        >
                          {percentage > 10 && (
                            <span style={{color: 'white', fontWeight: 700, fontSize: '0.875rem'}}>
                              {percentage.toFixed(0)}%
                            </span>
                          )}
                        </div>
                        {percentage <= 10 && (
                          <span style={{position: 'absolute', right: '1rem', top: '50%', transform: 'translateY(-50%)', color: '#475569', fontWeight: 700, fontSize: '0.875rem'}}>
                            {percentage.toFixed(0)}%
                          </span>
                        )}
                      </div>

                      <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
                        <button onClick={() => updateGoalProgress(goal)} className="btn btn-primary" style={{flex: 1, fontSize: '0.875rem'}}>
                          📊 Обновить прогресс
                        </button>
                        <button onClick={() => openEditModal(goal)} className="btn btn-secondary" style={{fontSize: '0.875rem'}}>
                          ✏️ Изменить
                        </button>
                      </div>

                      {isCompleted && (
                        <div style={{marginTop: '1rem', padding: '0.75rem', background: 'rgba(16, 185, 129, 0.1)', borderRadius: '8px', textAlign: 'center'}}>
                          <p style={{color: '#10b981', fontWeight: 600, fontSize: '1rem'}}>
                            🎊 Поздравляем! Цель достигнута! 🎊
                          </p>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {showModal && (
            <Modal onClose={() => setShowModal(false)} title={editingGoal ? 'Редактировать цель' : 'Создать новую цель'}>
              <div style={{display: 'flex', flexDirection: 'column', gap: '1.5rem'}}>
                <div className="form-group">
                  <label className="label">Название цели</label>
                  <input 
                    type="text" 
                    value={goalName} 
                    onChange={e => setGoalName(e.target.value)} 
                    placeholder="Например: Жим лежа 100 кг" 
                    className="input" 
                  />
                </div>

                <div className="form-group">
                  <label className="label">Целевой результат — можно с точкой или запятой</label>
                  <input 
                    type="text" 
                    inputMode="decimal"
                    value={goalTarget} 
                    onChange={e => {
                      const val = e.target.value.replace(',', '.');
                      if (val === '' || /^\d*\.?\d*$/.test(val)) setGoalTarget(val);
                    }} 
                    placeholder="100" 
                    className="input" 
                  />
                </div>

                <div className="form-group">
                  <label className="label">Текущий результат — можно с точкой или запятой</label>
                  <input 
                    type="text" 
                    inputMode="decimal"
                    value={goalCurrent} 
                    onChange={e => {
                      const val = e.target.value.replace(',', '.');
                      if (val === '' || /^\d*\.?\d*$/.test(val)) setGoalCurrent(val);
                    }} 
                    placeholder="80" 
                    className="input" 
                  />
                </div>

                <div className="form-group">
                  <label className="label">Единица измерения</label>
                  <input 
                    type="text" 
                    value={goalUnit} 
                    onChange={e => setGoalUnit(e.target.value)} 
                    placeholder="кг, раз, мин..." 
                    className="input" 
                  />
                </div>

                <button onClick={saveGoal} className="btn btn-primary">
                  {editingGoal ? 'Сохранить изменения' : 'Создать цель'}
                </button>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    function CalendarTab({ workouts }) {
      const [currentMonth, setCurrentMonth] = useState(new Date());

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDayOfWeek = firstDay.getDay();

        return { daysInMonth, startingDayOfWeek, year, month };
      };

      const getWorkoutDates = () => {
        const dates = new Set();
        workouts.forEach(w => {
          if (w.endDate) {
            const date = new Date(w.startDate);
            dates.add(`${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`);
          }
        });
        return dates;
      };

      const { daysInMonth, startingDayOfWeek, year, month } = getDaysInMonth(currentMonth);
      const workoutDates = getWorkoutDates();

      const prevMonth = () => {
        setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1));
      };

      const nextMonth = () => {
        setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1));
      };

      const isToday = (day) => {
        const today = new Date();
        return day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
      };

      const hasWorkout = (day) => {
        return workoutDates.has(`${year}-${month}-${day}`);
      };

      const getMonthStats = () => {
        const monthWorkouts = workouts.filter(w => {
          const date = new Date(w.startDate);
          return date.getMonth() === month && date.getFullYear() === year;
        });
        
        return {
          count: monthWorkouts.length,
          totalVolume: monthWorkouts.reduce(
            (sum, w) => sum + w.exercises.reduce((s, e) => s + e.sets.reduce((v, set) => v + set.weight * set.reps, 0), 0),
            0
          )
        };
      };

      const monthStats = getMonthStats();
      const weekDays = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

      return (
        <div className="card">
          <div style={{marginBottom: '2rem'}}>
            <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.5rem'}}>
              <button onClick={prevMonth} className="btn btn-secondary" style={{fontSize: '1.5rem', padding: '0.5rem 1rem'}}>
                ←
              </button>
              <h2 style={{fontSize: '1.5rem', fontWeight: 700, color: '#0f172a'}}>
                {currentMonth.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })}
              </h2>
              <button onClick={nextMonth} className="btn btn-secondary" style={{fontSize: '1.5rem', padding: '0.5rem 1rem'}}>
                →
              </button>
            </div>

            <div style={{display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '1rem', marginBottom: '2rem'}}>
              <div style={{background: 'linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%)', padding: '1rem', borderRadius: '12px'}}>
                <p style={{fontSize: '0.875rem', color: '#64748b', marginBottom: '0.25rem'}}>Тренировок в месяце</p>
                <p style={{fontSize: '2rem', fontWeight: 700, color: '#2563eb'}}>{monthStats.count}</p>
              </div>
              <div style={{background: 'linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%)', padding: '1rem', borderRadius: '12px'}}>
                <p style={{fontSize: '0.875rem', color: '#64748b', marginBottom: '0.25rem'}}>Тоннаж месяца</p>
                <p style={{fontSize: '2rem', fontWeight: 700, color: '#a855f7'}}>{(monthStats.totalVolume / 1000).toFixed(1)} т</p>
              </div>
            </div>

            <div style={{display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '0.5rem', marginBottom: '0.5rem'}}>
              {weekDays.map(day => (
                <div key={day} style={{textAlign: 'center', fontWeight: 600, color: '#64748b', fontSize: '0.875rem', padding: '0.5rem'}}>
                  {day}
                </div>
              ))}
            </div>

            <div style={{display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '0.5rem'}}>
              {Array.from({ length: (startingDayOfWeek === 0 ? 6 : startingDayOfWeek - 1) }, (_, i) => (
                <div key={`empty-${i}`} />
              ))}
              
              {Array.from({ length: daysInMonth }, (_, i) => {
                const day = i + 1;
                const today = isToday(day);
                const workout = hasWorkout(day);

                return (
                  <div
                    key={day}
                    style={{
                      aspectRatio: '1',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      borderRadius: '12px',
                      background: workout 
                        ? 'linear-gradient(135deg, #10b981 0%, #14b8a6 100%)' 
                        : today 
                          ? '#e2e8f0' 
                          : '#f8fafc',
                      border: today ? '2px solid #2563eb' : 'none',
                      color: workout ? 'white' : '#0f172a',
                      fontWeight: workout || today ? 700 : 500,
                      fontSize: '1rem',
                      position: 'relative',
                      cursor: workout ? 'pointer' : 'default',
                      transition: 'transform 0.2s, box-shadow 0.2s',
                      boxShadow: workout ? '0 4px 12px rgba(16, 185, 129, 0.3)' : 'none'
                    }}
                    onMouseEnter={(e) => {
                      if (workout) {
                        e.currentTarget.style.transform = 'scale(1.1)';
                        e.currentTarget.style.boxShadow = '0 8px 24px rgba(16, 185, 129, 0.4)';
                      }
                    }}
                    onMouseLeave={(e) => {
                      if (workout) {
                        e.currentTarget.style.transform = 'scale(1)';
                        e.currentTarget.style.boxShadow = '0 4px 12px rgba(16, 185, 129, 0.3)';
                      }
                    }}
                  >
                    {day}
                    {workout && (
                      <div style={{position: 'absolute', bottom: '4px', right: '4px', fontSize: '0.75rem'}}>
                        💪
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <div style={{marginTop: '2rem', padding: '1rem', background: '#fef3c7', borderRadius: '12px'}}>
              <p style={{fontSize: '0.875rem', color: '#78350f', textAlign: 'center'}}>
                💡 <strong>Совет:</strong> Стремитесь к регулярности! Даже 3 тренировки в неделю приведут к отличным результатам.
              </p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('GymFlow PWA ServiceWorker registered with scope:', registration.scope);
          })
          .catch((error) => {
            console.warn('GymFlow PWA ServiceWorker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
